<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Growth Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0d1014; --surface:#161a20; --surface-2:#1c212a; --border:#2a313c; --border-2:#222833;
  --ink:#e9ecf1; --muted:#949dab; --faint:#68727f;
  --gold:#d9a441; --gold-soft:#7a5f28; --gold-bg:#241d0f;
  --up:#3fb950; --up-soft:#1e3a27; --down:#f0546a; --down-soft:#3f2129;
  --agg:#d9a441; --agg-band:#d9a4412e; --calm:#4bb8c0; --calm-band:#4bb8c02b;
  --grid:#20262f; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.015em;text-wrap:balance}
.wrap{max-width:1040px;margin:0 auto;padding:22px clamp(14px,4vw,28px) 80px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}

.head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin:6px 0 18px}
.head h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800}
.picker{display:flex;align-items:center;gap:8px}
.picker select{font-family:inherit;font-size:.9rem;font-weight:600;background:var(--surface);color:var(--ink);
  border:1px solid var(--border);border-radius:9px;padding:8px 12px;cursor:pointer}

/* status banner */
.banner{border-radius:16px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border);
  display:flex;gap:18px;align-items:flex-start;background:var(--surface)}
.banner .bicon{font-size:2rem;line-height:1;flex:none}
.banner .btxt h2{font-size:clamp(1.2rem,3vw,1.6rem);font-weight:800}
.banner .btxt p{margin:6px 0 0;color:var(--muted);font-size:.95rem;max-width:70ch}
.banner .act{margin-top:10px;display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.86rem;font-weight:600;
  padding:6px 12px;border-radius:8px}
.banner.b-ontrack{border-left:4px solid var(--up)} .banner.b-ontrack h2{color:var(--up)}
.banner.b-ahead{border-left:4px solid var(--up)} .banner.b-ahead h2{color:var(--up)}
.banner.b-behind{border-left:4px solid var(--gold)} .banner.b-behind h2{color:var(--gold)}
.banner.b-alert{border-left:4px solid var(--down)} .banner.b-alert h2{color:var(--down)}
.b-ontrack .act,.b-ahead .act{background:var(--up-soft);color:var(--up)}
.b-behind .act{background:var(--gold-bg);color:var(--gold)}
.b-alert .act{background:var(--down-soft);color:var(--down)}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.st{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px}
.st .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.4rem;line-height:1}
.st .l{font-size:.68rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
.pos{color:var(--up)} .neg{color:var(--down)}

/* action cards */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:17px 18px;box-shadow:var(--shadow)}
.acard h3{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.acard p{margin:0;color:var(--muted);font-size:.9rem}
.acard .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.25rem;margin:4px 0 2px}

/* chart */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 16px 6px;box-shadow:var(--shadow);margin-bottom:16px}
.chart-card h3{font-size:1rem;margin-bottom:4px}
.chart-legend{display:flex;flex-wrap:wrap;gap:15px;margin:4px 2px 8px;font-size:.76rem;color:var(--muted)}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:15px;height:9px;border-radius:2px;display:inline-block}
.sw.line{height:0;border-top:2px solid;width:17px}
#chart{width:100%;height:auto;display:block;overflow:visible}

/* milestone table */
.mtbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 4px}
.mtbl{width:100%;min-width:560px;border-collapse:collapse;font-size:.9rem}
.mtbl th,.mtbl td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--border-2);font-variant-numeric:tabular-nums}
.mtbl th:first-child,.mtbl td:first-child{text-align:left}
.mtbl thead th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.mtbl tbody td{font-family:"IBM Plex Mono",monospace}
.mtbl .med{font-weight:600;color:var(--ink)} .mtbl .p5c{color:var(--down)} .mtbl .p95c{color:var(--up)}
.mtbl tr.here{background:var(--gold-bg)} .mtbl tr.here td:first-child::after{content:" ← ab yahan";color:var(--gold);font-family:"IBM Plex Mono";font-size:.72rem}
.foot{margin-top:22px;font-size:.82rem;color:var(--faint);line-height:1.6}
.foot b{color:var(--muted)}
.err{background:var(--down-soft);color:var(--down);border-radius:12px;padding:16px;font-weight:600}

@media (max-width:820px){ .strip{grid-template-columns:repeat(3,1fr)} .acts{grid-template-columns:1fr} }
@media (max-width:520px){ .strip{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">Live Growth Roadmap · auto-tracked</div>
      <h1 id="ttl">Roadmap</h1>
    </div>
    <div class="picker">
      <label class="mono" style="font-size:.72rem;color:var(--muted)">STRATEGY</label>
      <select id="stratSel" onchange="loadRoadmap(this.value)"></select>
    </div>
  </div>

  <div id="content"><p style="color:var(--muted)">Loading…</p></div>

  <div class="foot" id="foot"></div>
</div>

<script src="{{ url_for('static', filename='js/env-badge.js') }}"></script>
<script src="{{ url_for('static', filename='js/topnav.js') }}"></script>
<script>
const L = "₹";
const fmtL = v => "₹" + Number(v).toFixed(Math.abs(v)>=100?0:1) + "L";
const fmtR = v => "₹" + Math.round(v).toLocaleString('en-IN');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MONTHS = 24, DPM = 30.44;

let RD = null;

async function boot(){
  try{
    const r = await fetch('/api/roadmap');
    const j = await r.json();
    const sel = document.getElementById('stratSel');
    sel.innerHTML = (j.strategies||[]).map(s=>`<option value="${s.id}">${s.label}</option>`).join('');
    if(j.data){ sel.value = j.data.id; render(j.data); }
    else if((j.strategies||[]).length){ loadRoadmap(j.strategies[0].id); }
  }catch(e){ document.getElementById('content').innerHTML = `<div class="err">Load failed: ${e}</div>`; }
}
async function loadRoadmap(id){
  const r = await fetch('/api/roadmap?strategy='+encodeURIComponent(id));
  const j = await r.json();
  render(j.data || j);
}

function bandClass(b){ return {ontrack:'b-ontrack','on-track':'b-ontrack',ahead:'b-ahead',behind:'b-behind',alert:'b-alert',review:'b-alert'}[b]||'b-ontrack'; }
function bandIcon(b){ return {'on-track':'✅',ahead:'🚀',behind:'🟡',alert:'🔴',review:'🔴'}[b]||'✅'; }

function render(d){
  RD = d;
  if(!d || d.error){ document.getElementById('content').innerHTML = `<div class="err">${(d&&d.error)||'no data'} — is strategy ka roadmap configure nahi hai.</div>`; return; }
  document.getElementById('ttl').textContent = d.label;
  const s = d.status, c = d.corridor, cf = d.cfg;
  const bc = bandClass(s.band);

  const actLine = s.action==='add_lot' ? `<span class="act">🎯 ACTION: ${s.lot_msg}</span>`
    : s.action==='review' ? `<span class="act">🔍 ACTION: engine re-validate karo</span>`
    : `<span class="act">✔ Kuch karne ki zaroorat nahi — rule pe raho</span>`;

  let html = `
  <div class="banner ${bc}">
    <div class="bicon">${bandIcon(s.band)}</div>
    <div class="btxt">
      <h2>${s.verdict}</h2>
      <p>${d.label} · ${s.days} din chali · ${s.trades} trades · abhi equity ${fmtR(s.equity)} vs median ${s.expected_median!=null?fmtL(s.expected_median):'—'} ${s.vs_median!=null?`(${s.vs_median>=0?'+':''}${s.vs_median.toFixed(1)}L)`:''}.</p>
      ${actLine}
    </div>
  </div>

  <div class="strip">
    <div class="st"><div class="v">${fmtR(s.equity)}</div><div class="l">Equity</div></div>
    <div class="st"><div class="v ${s.net>=0?'pos':'neg'}">${s.net>=0?'+':''}${fmtR(s.net)}</div><div class="l">Net so far</div></div>
    <div class="st"><div class="v">${s.cur_lots}</div><div class="l">Lots now</div></div>
    <div class="st"><div class="v">${s.trades}</div><div class="l">Trades (${s.wins}W)</div></div>
    <div class="st"><div class="v">${s.days}d</div><div class="l">Since ${cf.start_date}</div></div>
    <div class="st"><div class="v">${c.cagr}%</div><div class="l">Median CAGR</div></div>
  </div>

  <div class="acts">
    <div class="acard">
      <h3>🎯 Lot kab badhana</h3>
      <div class="big">${s.cur_lots} → ${s.cur_lots+1} lots</div>
      <p>${s.lot_msg}</p>
    </div>
    <div class="acard">
      <h3>💰 Capital kab / kitna</h3>
      <div class="big">${cf.sip_per_month>0?fmtR(cf.sip_per_month)+'/mo':'Profit-only'}</div>
      <p>${s.cap_msg}</p>
    </div>
  </div>

  <div class="chart-card">
    <h3>Peeche kya hua · aage kya (2-saal corridor)</h3>
    <div class="chart-legend">
      <span><i class="sw line" style="border-color:var(--ink)"></i> Aapki asli equity</span>
      <span><i class="sw line" style="border-color:${cf.risk_pct==12?'var(--agg)':'var(--calm)'}"></i> Median (plan)</span>
      <span><i class="sw" style="background:${cf.risk_pct==12?'var(--agg-band)':'var(--calm-band)'};opacity:1"></i> Likely zone</span>
      <span><i class="sw" style="background:var(--up)"></i> Good luck p95</span>
      <span><i class="sw" style="background:var(--down)"></i> Bad luck p5</span>
    </div>
    <svg id="chart" viewBox="0 0 900 380" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="mtbl-wrap">
    <table class="mtbl" id="mtbl">
      <thead><tr><th>Milestone</th><th>Bad luck (p5)</th><th>Median (plan)</th><th>Good luck (p95)</th><th>Lots</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>`;
  document.getElementById('content').innerHTML = html;
  drawChart(d);
  fillTable(d);

  document.getElementById('foot').innerHTML = `<b>Kaise:</b> ${d.meta.n||251} real trades ka Monte-Carlo corridor (Sharpe ${d.meta.sharpe}, p=${d.meta.p_value}) · aapki asli equity order_store se (net = gross − real charges). Track: <b>${cf.risk_pct}% ${cf.risk_pct==12?'Aggressive':'Reasonable'}${cf.sip_per_month>0?' + SIP':''}</b> · margin ₹${(cf.margin_per_lot||0).toLocaleString('en-IN')}/lot (real SPAN) · +1 lot per ₹${Math.round(d.lot_step).toLocaleString('en-IN')} equity. Median = optimistic-if-edge-holds, promise nahi — plan p5 pe. Display-only.`;
}

function drawChart(d){
  const c = d.corridor, cf = d.cfg, act = d.actual, s = d.status;
  const svg = document.getElementById('chart');
  const W=900,H=380,ml=50,mr=14,mt=16,mb=30, iw=W-ml-mr, ih=H-mt-mb;
  const yMax = Math.ceil(Math.max(...c.p95, s.equity/1e5)/10)*10, yMin=Math.min(10, Math.floor((Math.min(...c.p5,s.equity/1e5)-0.5)));
  const x = m => ml + (m/MONTHS)*iw;
  const y = v => mt + ih - ((v-yMin)/(yMax-yMin))*ih;
  const agg = cf.risk_pct==12, lineC = agg?css('--agg'):css('--calm'), bandC = agg?css('--agg-band'):css('--calm-band');
  const up=css('--up'),down=css('--down'),grid=css('--grid'),muted=css('--muted'),faint=css('--faint'),ink=css('--ink');
  const p25=c.p50.map((v,i)=>v-(v-c.p5[i])*0.5), p75=c.p50.map((v,i)=>v+(c.p95[i]-v)*0.5);
  const path=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const band=(lo,hi)=>{let s='M';hi.forEach((v,i)=>s+=x(i).toFixed(1)+','+y(v).toFixed(1)+' L');for(let i=lo.length-1;i>=0;i--)s+=x(i).toFixed(1)+','+y(lo[i]).toFixed(1)+' L';return s.replace(/L$/,'')+'Z';};
  let g='';
  const step = yMax>60?20:10;
  for(let v=Math.ceil(yMin/step)*step; v<=yMax; v+=step){ g+=`<line x1="${ml}" y1="${y(v)}" x2="${W-mr}" y2="${y(v)}" stroke="${grid}"/>`; g+=`<text x="${ml-7}" y="${y(v)+3.5}" text-anchor="end" font-size="11" fill="${faint}" font-family="IBM Plex Mono">₹${v}L</text>`; }
  const bk = cf.book/1e5;
  g+=`<line x1="${ml}" y1="${y(bk)}" x2="${W-mr}" y2="${y(bk)}" stroke="${muted}" stroke-dasharray="3 3" opacity="0.5"/>`;
  [0,3,6,12,18,24].forEach(m=>g+=`<text x="${x(m)}" y="${H-9}" text-anchor="middle" font-size="11" fill="${faint}" font-family="IBM Plex Mono">${m===0?'start':m+'m'}</text>`);
  g+=`<path d="${band(c.p5,c.p95)}" fill="${bandC}" opacity="0.45"/>`;
  g+=`<path d="${band(p25,p75)}" fill="${bandC}"/>`;
  g+=`<path d="${path(c.p95)}" fill="none" stroke="${up}" stroke-width="1.3" opacity="0.7" stroke-dasharray="1 3"/>`;
  g+=`<path d="${path(c.p5)}" fill="none" stroke="${down}" stroke-width="1.3" opacity="0.8" stroke-dasharray="1 3"/>`;
  g+=`<path d="${path(c.p50)}" fill="none" stroke="${lineC}" stroke-width="2.4" stroke-linejoin="round"/>`;
  g+=`<circle cx="${x(24)}" cy="${y(c.p50[24])}" r="4" fill="${lineC}"/><text x="${x(24)-6}" y="${y(c.p50[24])-8}" text-anchor="end" font-size="12" font-weight="700" fill="${lineC}" font-family="Bricolage Grotesque">${fmtL(c.p50[24])}</text>`;
  // ACTUAL equity line (start → today), month-idx x from dates
  const d0 = new Date(cf.start_date+'T00:00:00');
  const pts = [{m:0, v:bk}].concat((act.points||[]).map(p=>({m:(new Date(p.date+'T00:00:00')-d0)/(86400000*DPM), v:p.equity/1e5})));
  // ensure a point at 'now' month_idx
  if(s.month_idx>0 && pts[pts.length-1].m < s.month_idx) pts.push({m:s.month_idx, v:s.equity/1e5});
  const ap = pts.map((p,i)=>(i?'L':'M')+x(p.m).toFixed(1)+','+y(p.v).toFixed(1)).join(' ');
  g+=`<path d="${ap}" fill="none" stroke="${ink}" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last = pts[pts.length-1];
  g+=`<circle cx="${x(last.m)}" cy="${y(last.v)}" r="5" fill="${ink}" stroke="${css('--surface')}" stroke-width="2"/>`;
  g+=`<text x="${x(last.m)+8}" y="${y(last.v)-8}" font-size="12" font-weight="700" fill="${ink}" font-family="Bricolage Grotesque">ab: ${fmtL(last.v)}</text>`;
  svg.innerHTML = g;
}

function fillTable(d){
  const c=d.corridor, s=d.status;
  const rows=[[3,'3 mahine'],[6,'6 mahine'],[12,'1 saal'],[18,'18 mahine'],[24,'2 saal']];
  const hereM = Math.round(s.month_idx);
  document.querySelector('#mtbl tbody').innerHTML = rows.map(([m,lbl])=>{
    const cls = (Math.abs(hereM-m)<=1 && s.month_idx>0.5)?' class="here"':'';
    return `<tr${cls}><td>${lbl}</td><td class="p5c">${fmtL(c.p5[m])}</td><td class="med">${fmtL(c.p50[m])}</td><td class="p95c">${fmtL(c.p95[m])}</td><td>${c.lots50[m]}</td></tr>`;
  }).join('');
}

boot();
</script>
</body>
</html>
