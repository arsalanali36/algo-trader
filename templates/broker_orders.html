<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broker Orders — Algo Trader</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0d1117; color:#e6edf3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap { max-width:1400px; margin:0 auto; padding:14px 16px 40px; }
  h1 { font-size:16px; margin:0; font-weight:700; }
  .sub { color:#8b949e; font-size:12px; }
  .bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .btn, select, input[type=date] { background:#161b22; color:#e6edf3; border:1px solid #30363d;
    border-radius:6px; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; }
  .btn:hover, select:hover { background:#21262d; }
  .btn.pri { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  .seg { display:inline-flex; border:1px solid #30363d; border-radius:7px; overflow:hidden; }
  .seg > span { padding:6px 13px; font-size:12px; font-weight:600; color:#8b949e; cursor:pointer; background:#161b22; }
  .seg > span.on { background:#1f6feb; color:#fff; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 12px; font-size:11px; }
  .chip { border:1px solid #30363d; border-radius:6px; padding:4px 9px; color:#8b949e; background:#161b22; }
  .chip.g { border-color:#238636; color:#3fb950; background:#12261a; }
  .chip.r { border-color:#6e2427; color:#f85149; background:#2d1416; }
  .chip.p { border-color:#3b3488; color:#a99fe0; background:#1c1a2e; }
  .card { border:1px solid #30363d; border-radius:8px; overflow:hidden; margin-bottom:16px; }
  .card > .hd { background:#161b22; padding:8px 11px; font-size:12px; font-weight:600; color:#c9d1d9;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tscroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:11.5px; min-width:820px; }
  thead th { background:#161b22; color:#8b949e; text-align:left; font-weight:600; padding:7px 9px;
    white-space:nowrap; cursor:pointer; user-select:none; position:sticky; top:0; }
  thead th:hover { color:#e6edf3; }
  thead th.rt { text-align:right; }
  thead th .ar { color:#1f6feb; font-size:10px; }
  tbody td { padding:6px 9px; border-top:1px solid #21262d; white-space:nowrap; }
  tbody td.rt { text-align:right; }
  tbody tr.rej { background:#2d1416; }
  .buy { color:#58a6ff; } .sell { color:#f85149; }
  .st-c { color:#3fb950; } .st-r { color:#f85149; } .st-o { color:#d29922; }
  .pr-mis { background:#2a2313; color:#e3b341; border-radius:4px; padding:1px 6px; }
  .pr-nrml { background:#1c2333; color:#79c0ff; border-radius:4px; padding:1px 6px; }
  .strat { color:#a99fe0; } .unmatched { color:#6e7681; }
  .why { color:#f0997b; } .muted { color:#8b949e; }
  .empty { padding:24px; text-align:center; color:#6e7681; font-size:12px; }
  .csvbox { border:1px dashed #30363d; border-radius:8px; padding:12px; margin-bottom:16px; background:#0f141b; }
  .match-yes { color:#3fb950; font-weight:700; } .match-no { color:#f85149; font-weight:700; }
  @media (max-width:760px){
    .wrap{ padding:10px 10px 30px; }
    .bar{ gap:6px; }
    .btn,select,input[type=date]{ padding:5px 8px; }
  }
</style>
</head>
<body>
<script src="/static/js/topnav.js"></script>
<div class="wrap">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <h1>🧾 Broker Orders</h1>
    <span class="chip" id="acct">Zerodha</span>
    <span class="sub" id="asof"></span>
  </div>

  <div class="bar">
    <select id="broker"><option value="kite">Zerodha (Kite)</option></select>
    <input type="date" id="date">
    <button class="btn" onclick="loadData()">↻ Refresh</button>
    <span class="seg" id="viewSeg">
      <span data-v="orders" class="on" onclick="setView('orders')">Orders</span>
      <span data-v="trades" onclick="setView('trades')">Trades</span>
      <span data-v="blocked" onclick="setView('blocked')">App-blocked</span>
    </span>
    <select id="fStatus" onchange="render()">
      <option value="">All statuses</option>
      <option value="COMPLETE">Complete</option>
      <option value="REJECTED">Rejected</option>
      <option value="CANCELLED">Cancelled</option>
      <option value="OPEN">Open</option>
    </select>
    <select id="fProduct" onchange="render()">
      <option value="">All products</option>
      <option value="MIS">MIS</option>
      <option value="NRML">NRML</option>
    </select>
    <input class="btn" id="fq" placeholder="🔎 search" style="cursor:text" oninput="render()">
  </div>

  <div class="chips" id="chips"></div>

  <div class="card">
    <div class="hd" id="tblHd">Orders</div>
    <div class="tscroll"><table id="tbl"><thead id="thd"></thead><tbody id="tbody"></tbody></table></div>
    <div class="empty" id="empty" style="display:none"></div>
  </div>

  <div class="csvbox">
    <div style="font-size:12px;font-weight:600;margin-bottom:6px">📤 Match Zerodha CSV vs actual broker trades</div>
    <div class="sub" style="margin-bottom:8px">Zerodha ka tradebook CSV (Trade ID · Fill time · Type · Instrument · Product · Qty · Avg Price) upload karo — per-contract exact match check hoga.</div>
    <input type="file" id="csvfile" accept=".csv" class="btn" style="cursor:pointer">
    <button class="btn pri" onclick="matchCsv()">Match</button>
    <span id="csvStatus" class="sub"></span>
    <div id="csvResult" style="margin-top:10px"></div>
  </div>
</div>

<script>
var DATA = { orders:[], trades:[], blocked:[], summary:{} };
var VIEW = 'orders';
var SORT = { orders:{c:'time',d:-1}, trades:{c:'time',d:-1}, blocked:{c:'time',d:-1} };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function num(v){ return (v==null||v==='')?'':Number(v).toLocaleString('en-IN'); }
function px(v){ return (v==null||v==='')?'—':Number(v).toFixed(2); }

var COLS = {
  orders: [
    {id:'time',   t:'Time',       g:function(o){return (o.time||'').slice(11,19)||o.time;}},
    {id:'side',   t:'Type',       g:function(o){return o.side;}, cell:function(o){return '<span class="'+(o.side==='BUY'?'buy':'sell')+'">'+esc(o.side)+'</span>';}},
    {id:'trad_sym',t:'Instrument',g:function(o){return o.trad_sym||o.tradingsymbol;}},
    {id:'product',t:'Product',    g:function(o){return o.product;}, cell:function(o){var p=(o.product||'').toUpperCase();var c=p==='MIS'?'pr-mis':(p==='NRML'||p==='CNC'?'pr-nrml':'');return c?'<span class="'+c+'">'+esc(p)+'</span>':esc(p);}},
    {id:'qty',    t:'Qty',        rt:1, g:function(o){return o.filled_qty||0;}, cell:function(o){return num(o.filled_qty)+' / '+num(o.qty);}},
    {id:'price',  t:'Avg',        rt:1, g:function(o){return o.price||0;}, cell:function(o){return px(o.price);}},
    {id:'status', t:'Status',     g:function(o){return o.status;}, cell:function(o){var s=o.status||'';var c=s==='COMPLETE'?'st-c':(s==='REJECTED'||s==='CANCELLED'?'st-r':'st-o');return '<span class="'+c+'">'+esc(s)+'</span>';}},
    {id:'strategy',t:'Strategy',  g:function(o){return o.strategy||'zzz';}, cell:function(o){return o.matched?'<span class="strat">'+esc(o.strategy)+'</span>':'<span class="unmatched">unmatched</span>';}},
    {id:'note',   t:'Why / note', g:function(o){return o.status_message||(o.matched?'':'z');}, cell:function(o){
        if(o.status==='REJECTED'||o.status==='CANCELLED') return '<span class="why">⚠ '+esc(o.status_message||'rejected by broker')+'</span>';
        if(!o.matched) return '<span class="why">⚠ app me nahi — manual?</span>';
        return '<span class="muted">—</span>'; }},
  ],
  trades: [
    {id:'trade_id',t:'Trade ID',  g:function(o){return o.trade_id;}},
    {id:'time',    t:'Fill time', g:function(o){return (o.time||'').slice(11,19)||o.time;}},
    {id:'side',    t:'Type',      g:function(o){return o.side;}, cell:function(o){return '<span class="'+(o.side==='BUY'?'buy':'sell')+'">'+esc(o.side)+'</span>';}},
    {id:'trad_sym',t:'Instrument',g:function(o){return o.trad_sym||o.tradingsymbol;}},
    {id:'product', t:'Product',   g:function(o){return o.product;}, cell:function(o){var p=(o.product||'').toUpperCase();var c=p==='MIS'?'pr-mis':(p==='NRML'||p==='CNC'?'pr-nrml':'');return c?'<span class="'+c+'">'+esc(p)+'</span>':esc(p);}},
    {id:'qty',     t:'Qty',       rt:1, g:function(o){return o.qty||0;}, cell:function(o){return num(o.qty);}},
    {id:'price',   t:'Avg',       rt:1, g:function(o){return o.price||0;}, cell:function(o){return px(o.price);}},
    {id:'strategy',t:'Strategy',  g:function(o){return o.strategy||'zzz';}, cell:function(o){return o.matched?'<span class="strat">'+esc(o.strategy)+'</span>':'<span class="unmatched">—</span>';}},
  ],
  blocked: [
    {id:'time',    t:'Time',      g:function(o){return o.time;}},
    {id:'side',    t:'Type',      g:function(o){return o.side;}, cell:function(o){return '<span class="'+(o.side==='BUY'?'buy':'sell')+'">'+esc(o.side)+'</span>';}},
    {id:'symbol',  t:'Symbol',    g:function(o){return o.symbol;}},
    {id:'trad_sym',t:'Instrument',g:function(o){return o.trad_sym;}},
    {id:'lots',    t:'Lots',      rt:1, g:function(o){return o.lots||0;}, cell:function(o){return o.lots==null?'—':num(o.lots);}},
    {id:'strategy',t:'Strategy',  g:function(o){return o.strategy;}, cell:function(o){return '<span class="strat">'+esc(o.strategy)+'</span>';}},
    {id:'reason',  t:'Blocked — why', g:function(o){return o.reason;}, cell:function(o){return '<span class="why">⛔ '+esc(o.reason||'RMS blocked')+'</span>';}},
  ]
};

function setView(v){ VIEW=v; document.querySelectorAll('#viewSeg span').forEach(function(s){s.classList.toggle('on',s.getAttribute('data-v')===v);}); render(); }

function loadData(){
  var d = document.getElementById('date').value;
  var b = document.getElementById('broker').value;
  document.getElementById('asof').textContent = 'loading…';
  fetch('/api/broker-orders?broker='+b+(d?('&date='+d):''))
    .then(function(r){return r.json();})
    .then(function(j){
      DATA = j || {};
      DATA.orders = DATA.orders||[]; DATA.trades=DATA.trades||[]; DATA.blocked=DATA.blocked||[]; DATA.summary=DATA.summary||{};
      document.getElementById('asof').textContent = j.ok ? ('as of '+(j.date||'')+' · '+((DATA.summary.orders)||0)+' orders') : ('⚠ '+(j.error||'load failed'));
      renderChips();
      render();
    })
    .catch(function(e){ document.getElementById('asof').textContent='⚠ '+e; });
}

function renderChips(){
  var s = DATA.summary||{};
  var h = '';
  h += '<span class="chip g">✔ Complete '+(s.complete||0)+'</span>';
  h += '<span class="chip r">✕ Rejected/Cancelled '+(s.rejected||0)+'</span>';
  h += '<span class="chip">NRML '+(s.nrml||0)+' · MIS '+(s.mis||0)+'</span>';
  h += '<span class="chip">Trades '+(s.trades||0)+'</span>';
  h += '<span class="chip p">Matched to app '+(s.matched||0)+' / '+(s.orders||0)+'</span>';
  if(s.blocked) h += '<span class="chip r">⛔ App-blocked '+s.blocked+'</span>';
  document.getElementById('chips').innerHTML = h;
}

function sortBy(c){ var st=SORT[VIEW]; if(st.c===c){ st.d=-st.d; } else { st.c=c; st.d=1; } render(); }

function render(){
  var cols = COLS[VIEW];
  var rows = (VIEW==='orders'?DATA.orders:VIEW==='trades'?DATA.trades:DATA.blocked)||[];
  // filters (orders/trades only for status/product; search everywhere)
  var fs=document.getElementById('fStatus').value, fp=document.getElementById('fProduct').value, fq=(document.getElementById('fq').value||'').toLowerCase();
  rows = rows.filter(function(o){
    if(fs && VIEW==='orders' && (o.status||'')!==fs) return false;
    if(fp && (VIEW==='orders'||VIEW==='trades')){ var p=(o.product||'').toUpperCase(); if(p!==fp && !(fp==='NRML'&&p==='CNC')) return false; }
    if(fq){ var blob=((o.trad_sym||'')+' '+(o.tradingsymbol||'')+' '+(o.strategy||'')+' '+(o.symbol||'')+' '+(o.status||'')+' '+(o.reason||'')).toLowerCase(); if(blob.indexOf(fq)<0) return false; }
    return true;
  });
  // sort
  var st=SORT[VIEW], col=null; cols.forEach(function(c){ if(c.id===st.c) col=c; });
  if(col){ rows=rows.slice().sort(function(a,b){ var x=col.g(a),y=col.g(b); if(typeof x==='number'&&typeof y==='number'){return (x-y)*st.d;} x=String(x==null?'':x); y=String(y==null?'':y); return x<y?-st.d:x>y?st.d:0; }); }
  // header
  var thd='<tr>'+cols.map(function(c){ var ar=(st.c===c.id)?(' <span class="ar">'+(st.d>0?'▲':'▼')+'</span>'):''; return '<th class="'+(c.rt?'rt':'')+'" onclick="sortBy(\''+c.id+'\')">'+esc(c.t)+ar+'</th>'; }).join('')+'</tr>';
  document.getElementById('thd').innerHTML=thd;
  document.getElementById('tblHd').textContent = (VIEW==='orders'?'Order book':VIEW==='trades'?'Trade book (fills)':'App-blocked entries (never reached broker)')+' · '+rows.length;
  // body
  var body = rows.map(function(o){
    var rej = (VIEW==='orders' && (o.status==='REJECTED'||o.status==='CANCELLED'));
    var tds = cols.map(function(c){ var v=c.cell?c.cell(o):esc(c.g(o)); return '<td class="'+(c.rt?'rt':'')+'">'+v+'</td>'; }).join('');
    return '<tr'+(rej?' class="rej"':'')+'>'+tds+'</tr>';
  }).join('');
  document.getElementById('tbody').innerHTML=body;
  var emp=document.getElementById('empty');
  if(!rows.length){ emp.style.display='block'; emp.textContent = (VIEW==='blocked'?'Aaj koi RMS-blocked entry nahi.':'Koi row nahi.'); document.getElementById('tbl').style.display='none'; }
  else { emp.style.display='none'; document.getElementById('tbl').style.display=''; }
}

function matchCsv(){
  var f=document.getElementById('csvfile').files[0];
  var st=document.getElementById('csvStatus'), out=document.getElementById('csvResult');
  if(!f){ st.textContent=' — pehle CSV chuno'; return; }
  st.textContent=' matching…'; out.innerHTML='';
  var fd=new FormData(); fd.append('file',f);
  fetch('/api/broker-orders/csv-match?broker='+document.getElementById('broker').value,{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(j){
      st.textContent='';
      if(!j.ok){ out.innerHTML='<span class="match-no">⚠ '+esc(j.error||'match failed')+'</span>'; return; }
      var s=j.summary||{};
      var head = j.exact_match
        ? '<div class="match-yes">✔ EXACT MATCH — CSV ke saare '+(s.matched||0)+' contracts broker se milte hain.</div>'
        : '<div class="match-no">✕ MISMATCH — '+(s.mismatched||0)+' contract match nahi ('+(s.matched||0)+' match).</div>';
      var rows = (j.rows||[]).map(function(r){
        var c = r.match?'st-c':'st-r';
        return '<tr><td>'+esc(r.trad_sym)+'</td><td class="rt">'+r.csv_net+'</td><td class="rt">'+r.broker_net+'</td><td class="rt">'+r.csv_fills+' / '+r.broker_fills+'</td><td class="'+c+'">'+(r.match?'✔ match':'✕ '+esc(r.note))+'</td></tr>';
      }).join('');
      out.innerHTML = head +
        '<div class="sub" style="margin:6px 0">CSV fills '+(s.csv_fills||0)+' · broker fills '+(s.broker_fills||0)+' · contracts '+(s.contracts||0)+'</div>'+
        '<div class="tscroll" style="margin-top:6px"><table style="min-width:520px"><thead><tr><th>Instrument</th><th class="rt">CSV net</th><th class="rt">Broker net</th><th class="rt">Fills C/B</th><th>Match</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    })
    .catch(function(e){ st.textContent=' ⚠ '+e; });
}

(function(){
  var t=new Date(); var ist=new Date(t.getTime()+(330+t.getTimezoneOffset())*60000);
  document.getElementById('date').value = ist.toISOString().slice(0,10);
  loadData();
})();
</script>
</body>
</html>
