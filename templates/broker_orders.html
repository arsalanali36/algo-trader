<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broker Orders — Algo Trader</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0d1117; color:#e6edf3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap { max-width:1400px; margin:0 auto; padding:14px 16px 40px; }
  h1 { font-size:16px; margin:0; font-weight:700; }
  .sub { color:#8b949e; font-size:12px; }
  .bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:12px 0 6px; }
  .btn, select, input[type=date] { background:#161b22; color:#e6edf3; border:1px solid #30363d;
    border-radius:6px; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; }
  .btn:hover, select:hover { background:#21262d; }
  .btn.pri { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  .seg { display:inline-flex; border:1px solid #30363d; border-radius:7px; overflow:hidden; }
  .seg > span { padding:6px 13px; font-size:12px; font-weight:600; color:#8b949e; cursor:pointer; background:#161b22; }
  .seg > span.on { background:#1f6feb; color:#fff; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 12px; font-size:11px; }
  .chip { border:1px solid #30363d; border-radius:6px; padding:4px 9px; color:#8b949e; background:#161b22; }
  .chip.g { border-color:#238636; color:#3fb950; background:#12261a; }
  .chip.r { border-color:#6e2427; color:#f85149; background:#2d1416; }
  .chip.p { border-color:#3b3488; color:#a99fe0; background:#1c1a2e; }
  .chip.b { border-color:#8a6d1a; color:#e3b341; background:#2a2313; }
  .card { border:1px solid #30363d; border-radius:8px; overflow:hidden; margin-bottom:16px; }
  .card > .hd { background:#161b22; padding:8px 11px; font-size:12px; font-weight:600; color:#c9d1d9; }
  .tscroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:11.5px; min-width:760px; }
  thead th { background:#161b22; color:#8b949e; text-align:left; font-weight:600; padding:7px 9px;
    white-space:nowrap; cursor:pointer; user-select:none; position:sticky; top:0; }
  thead th:hover { color:#e6edf3; }
  thead th.rt { text-align:right; }
  thead th .ar { color:#1f6feb; font-size:10px; }
  tbody td { padding:6px 9px; border-top:1px solid #21262d; white-space:nowrap; }
  tbody td.rt { text-align:right; }
  tbody tr.bad { background:#2d1416; }
  .buy { color:#58a6ff; } .sell { color:#f85149; }
  .st-c { color:#3fb950; } .st-r { color:#f85149; } .st-o { color:#d29922; } .st-b { color:#e3b341; }
  .md-real { background:#3d1d1d; color:#ff9a9a; border-radius:4px; padding:1px 6px; font-weight:700; }
  .md-paper { background:#1c2333; color:#79c0ff; border-radius:4px; padding:1px 6px; }
  .pr-mis { background:#2a2313; color:#e3b341; border-radius:4px; padding:1px 6px; }
  .pr-nrml { background:#1c2333; color:#79c0ff; border-radius:4px; padding:1px 6px; }
  .strat { color:#a99fe0; } .unmatched { color:#6e7681; }
  .why { color:#f0997b; } .muted { color:#6e7681; }
  .empty { padding:24px; text-align:center; color:#6e7681; font-size:12px; }
  .csvbox { border:1px dashed #30363d; border-radius:8px; padding:12px; margin-bottom:16px; background:#0f141b; }
  .match-yes { color:#3fb950; font-weight:700; } .match-no { color:#f85149; font-weight:700; }
  @media (max-width:760px){ .wrap{ padding:10px 10px 30px; } .bar{ gap:6px; } .btn,select,input[type=date]{ padding:5px 8px; } }
</style>
</head>
<body>
<script src="/static/js/topnav.js"></script>
<div class="wrap">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <h1>🧾 Broker Orders</h1>
    <span class="sub" id="asof"></span>
  </div>

  <div class="bar">
    <span class="seg" id="modeSeg">
      <span data-m="all" class="on" onclick="setMode('all')">All</span>
      <span data-m="paper" onclick="setMode('paper')">📝 Paper</span>
      <span data-m="real" onclick="setMode('real')">🔴 Real</span>
    </span>
    <span id="dateNav" style="display:inline-flex;align-items:center;gap:4px">
      <button class="btn" onclick="stepDate(-1)">◀</button>
      <input type="date" id="date" onchange="loadData()">
      <button class="btn" onclick="stepDate(1)">▶</button>
      <button class="btn" onclick="goToday()">Today</button>
    </span>
    <button class="btn" onclick="loadData()">↻</button>
    <select id="fStrat" onchange="render()"><option value="">All strategies</option></select>
    <select id="fStatus" onchange="render()"><option value="">All statuses</option></select>
    <input class="btn" id="fq" placeholder="🔎 search" style="cursor:text" oninput="render()">
  </div>
  <div class="sub" id="noteLine" style="margin-bottom:6px"></div>

  <div class="chips" id="chips"></div>

  <div class="card">
    <div class="hd" id="tblHd">App orders</div>
    <div class="tscroll"><table id="tbl"><thead id="thd"></thead><tbody id="tbody"></tbody></table></div>
    <div class="empty" id="empty" style="display:none"></div>
  </div>

  <div class="csvbox">
    <div style="font-size:12px;font-weight:600;margin-bottom:6px">📤 Zerodha CSV se cross-check (added layer)</div>
    <div class="sub" style="margin-bottom:8px">Kisi din ka Zerodha tradebook CSV upload karo — us din ke REAL broker trades + per-contract exact-match dikhega (Kite historical API nahi deta, isliye purane din ke asli orders ka source yahi CSV hai).</div>
    <input type="file" id="csvfile" accept=".csv" class="btn" style="cursor:pointer">
    <button class="btn pri" onclick="matchCsv()">Match</button>
    <span id="csvStatus" class="sub"></span>
    <div id="csvResult" style="margin-top:10px"></div>
  </div>
</div>

<script>
var SRC='app', MODE='all';
var APP={orders:[],strategies:[],summary:{}}, BRK={orders:[],trades:[],blocked:[],summary:{}};
var BRKLOADED=false;
var SORT={ app:{c:'time',d:-1}, broker:{c:'time',d:-1} };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function num(v){ return (v==null||v==='')?'':Number(v).toLocaleString('en-IN'); }
function px(v){ return (v==null||v==='')?'—':Number(v).toFixed(2); }

var COLS = {
  app: [
    {id:'time',   t:'Time',       g:function(o){return o.time;}},
    {id:'mode',   t:'Mode',       g:function(o){return o.mode;}, cell:function(o){return '<span class="'+(o.raw_mode==='live'?'md-real':'md-paper')+'">'+esc(o.mode)+'</span>';}},
    {id:'side',   t:'Type',       g:function(o){return o.side;}, cell:function(o){return '<span class="'+(o.side==='BUY'?'buy':'sell')+'">'+esc(o.side)+'</span>';}},
    {id:'trad_sym',t:'Instrument',g:function(o){return o.trad_sym;}},
    {id:'strategy',t:'By / origin', g:function(o){return o.strategy||'zzz';}, cell:function(o){var k=o.origin_kind||'manual';var cls=k==='strategy'?'strat':(k==='rms'?'st-b':'unmatched');return '<span class="'+cls+'">'+esc(o.strategy||'—')+'</span>';}},
    {id:'qty',    t:'Qty',        rt:1, g:function(o){return o.qty||0;}, cell:function(o){return num(o.qty);}},
    {id:'price',  t:'Price',      rt:1, g:function(o){return o.price||0;}, cell:function(o){return px(o.price);}},
    {id:'status', t:'Status',     g:function(o){return o.status;}, cell:function(o){var s=o.status||'';var c=(s==='FILLED'||s==='COMPLETE'||s==='PAPER'||s==='OPEN'||s==='BOOKCLOSE'||s==='EXTERNALLY_CLOSED')?'st-c':(s==='REJECTED'||s==='CANCELLED'?'st-r':s==='BLOCKED'?'st-b':'st-o');return '<span class="'+c+'">'+esc(s)+'</span>';}},
    {id:'why',    t:'Note',       g:function(o){return o.bad?('a'+o.why):'z';}, cell:function(o){return o.bad?'<span class="why">'+esc(o.why)+'</span>':'<span class="muted">—</span>';}},
  ],
  broker: [
    {id:'time',   t:'Time',       g:function(o){return (o.time||'').slice(11,19)||o.time;}},
    {id:'side',   t:'Type',       g:function(o){return o.side;}, cell:function(o){return '<span class="'+(o.side==='BUY'?'buy':'sell')+'">'+esc(o.side)+'</span>';}},
    {id:'trad_sym',t:'Instrument',g:function(o){return o.trad_sym||o.tradingsymbol;}},
    {id:'product',t:'Product',    g:function(o){return o.product;}, cell:function(o){var p=(o.product||'').toUpperCase();var c=p==='MIS'?'pr-mis':(p==='NRML'||p==='CNC'?'pr-nrml':'');return c?'<span class="'+c+'">'+esc(p)+'</span>':esc(p);}},
    {id:'qty',    t:'Qty',        rt:1, g:function(o){return o.filled_qty||0;}, cell:function(o){return num(o.filled_qty)+' / '+num(o.qty);}},
    {id:'price',  t:'Avg',        rt:1, g:function(o){return o.price||0;}, cell:function(o){return px(o.price);}},
    {id:'status', t:'Status',     g:function(o){return o.status;}, cell:function(o){var s=o.status||'';var c=s==='COMPLETE'?'st-c':(s==='REJECTED'||s==='CANCELLED'?'st-r':'st-o');return '<span class="'+c+'">'+esc(s)+'</span>';}},
    {id:'strategy',t:'Strategy',  g:function(o){return o.strategy||'zzz';}, cell:function(o){return o.matched?'<span class="strat">'+esc(o.strategy)+'</span>':'<span class="unmatched">unmatched</span>';}},
    {id:'note',   t:'Why / note', g:function(o){return o.status_message||(o.matched?'':'z');}, cell:function(o){ if(o.status==='REJECTED'||o.status==='CANCELLED') return '<span class="why">⚠ '+esc(o.status_message||'rejected by broker')+'</span>'; if(!o.matched) return '<span class="why">manual / external</span>'; return '<span class="muted">—</span>'; }},
  ]
};

function setMode(m){ MODE=m; document.querySelectorAll('#modeSeg span').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-m')===m);}); loadData(); }
function stepDate(d){ var el=document.getElementById('date'); var dt=new Date(el.value+'T00:00:00'); dt.setDate(dt.getDate()+d); el.value=dt.toISOString().slice(0,10); loadData(); }
function goToday(){ var t=new Date(); var ist=new Date(t.getTime()+(330+t.getTimezoneOffset())*60000); document.getElementById('date').value=ist.toISOString().slice(0,10); loadData(); }

function loadData(){
  document.getElementById('asof').textContent='loading…';
  if(SRC==='app'){
    var d=document.getElementById('date').value, m=MODE;
    fetch('/api/app-orders?date='+d+(m&&m!=='all'?('&mode='+m):''))
      .then(function(r){return r.json();})
      .then(function(j){
        APP=j||{}; APP.orders=APP.orders||[]; APP.strategies=APP.strategies||[]; APP.summary=APP.summary||{};
        document.getElementById('asof').textContent = j.ok?(d+' · '+(APP.summary.total||0)+' orders'):('⚠ '+(j.error||'load failed'));
        document.getElementById('noteLine').textContent='App ke apne records (order_store) — jo bhi order fire hua, paper aur real dono. Galat orders (rejected/blocked/₹0) laal me flagged.';
        fillStratFilter(APP.strategies);
        render();
      }).catch(function(e){ document.getElementById('asof').textContent='⚠ '+e; });
  } else {
    fetch('/api/broker-orders?broker=kite')
      .then(function(r){return r.json();})
      .then(function(j){
        BRK=j||{}; BRK.orders=BRK.orders||[]; BRK.summary=BRK.summary||{}; BRKLOADED=true;
        document.getElementById('asof').textContent = j.ok?((j.date||'')+' · '+(BRK.summary.orders||0)+' broker orders'):('⚠ '+(j.error||'load failed'));
        document.getElementById('noteLine').textContent = j.note || 'Zerodha ka asli order book — sirf aaj ka.';
        fillStratFilter([]);
        render();
      }).catch(function(e){ document.getElementById('asof').textContent='⚠ '+e; });
  }
}

function fillStratFilter(list){
  var sel=document.getElementById('fStrat'), cur=sel.value;
  var h='<option value="">All strategies</option>';
  (list||[]).forEach(function(s){ h+='<option value="'+esc(s)+'">'+esc(s)+'</option>'; });
  sel.innerHTML=h; sel.value=cur;
}

function renderChips(){
  var c=document.getElementById('chips'), h='';
  if(SRC==='app'){
    var s=APP.summary||{};
    h+='<span class="chip">Total '+(s.total||0)+'</span>';
    h+='<span class="chip p">📝 Paper '+(s.paper||0)+'</span>';
    h+='<span class="chip r">🔴 Real '+(s.real||0)+'</span>';
    h+='<span class="chip g">✔ OK '+(s.good||0)+'</span>';
    h+='<span class="chip r">⚠ Galat '+(s.bad||0)+'</span>';
    h+='<span class="chip b">⛔ Blocked '+(s.blocked||0)+' · Rejected '+(s.rejected||0)+'</span>';
  } else {
    var b=BRK.summary||{};
    h+='<span class="chip g">✔ Complete '+(b.complete||0)+'</span>';
    h+='<span class="chip r">✕ Rejected '+(b.rejected||0)+'</span>';
    h+='<span class="chip">NRML '+(b.nrml||0)+' · MIS '+(b.mis||0)+'</span>';
    h+='<span class="chip">Trades '+(b.trades||0)+'</span>';
    h+='<span class="chip p">Matched to app '+(b.matched||0)+' / '+(b.orders||0)+'</span>';
  }
  c.innerHTML=h;
}

function sortBy(col){ var st=SORT[SRC]; if(st.c===col){st.d=-st.d;}else{st.c=col;st.d=1;} render(); }

function render(){
  renderChips();
  var cols=COLS[SRC];
  var rows=(SRC==='app'?APP.orders:BRK.orders)||[];
  var fst=document.getElementById('fStrat').value, fs=document.getElementById('fStatus').value, fq=(document.getElementById('fq').value||'').toLowerCase();
  // status filter options (from current rows)
  var stset={}; rows.forEach(function(o){ if(o.status) stset[o.status]=1; });
  var ssel=document.getElementById('fStatus'), scur=ssel.value;
  ssel.innerHTML='<option value="">All statuses</option>'+Object.keys(stset).sort().map(function(s){return '<option value="'+s+'">'+s+'</option>';}).join('');
  ssel.value=scur;
  rows=rows.filter(function(o){
    if(fst && (o.strategy||'')!==fst) return false;
    if(fs && (o.status||'')!==fs) return false;
    if(fq){ var blob=((o.trad_sym||'')+' '+(o.strategy||'')+' '+(o.status||'')+' '+(o.why||'')+' '+(o.mode||'')+' '+(o.side||'')).toLowerCase(); if(blob.indexOf(fq)<0) return false; }
    return true;
  });
  var st=SORT[SRC], col=null; cols.forEach(function(c){ if(c.id===st.c) col=c; });
  if(col){ rows=rows.slice().sort(function(a,b){ var x=col.g(a),y=col.g(b); if(typeof x==='number'&&typeof y==='number'){return (x-y)*st.d;} x=String(x==null?'':x);y=String(y==null?'':y); return x<y?-st.d:x>y?st.d:0; }); }
  document.getElementById('thd').innerHTML='<tr>'+cols.map(function(c){var ar=(st.c===c.id)?(' <span class="ar">'+(st.d>0?'▲':'▼')+'</span>'):'';return '<th class="'+(c.rt?'rt':'')+'" onclick="sortBy(\''+c.id+'\')">'+esc(c.t)+ar+'</th>';}).join('')+'</tr>';
  document.getElementById('tblHd').textContent=(SRC==='app'?'App orders':'Zerodha live order book')+' · '+rows.length;
  document.getElementById('tbody').innerHTML=rows.map(function(o){
    var bad=(SRC==='app'&&o.bad)||(SRC==='broker'&&(o.status==='REJECTED'||o.status==='CANCELLED'));
    return '<tr'+(bad?' class="bad"':'')+'>'+cols.map(function(c){return '<td class="'+(c.rt?'rt':'')+'">'+(c.cell?c.cell(o):esc(c.g(o)))+'</td>';}).join('')+'</tr>';
  }).join('');
  var emp=document.getElementById('empty');
  if(!rows.length){ emp.style.display='block'; emp.textContent='Is din/filter pe koi order nahi.'; document.getElementById('tbl').style.display='none'; }
  else { emp.style.display='none'; document.getElementById('tbl').style.display=''; }
}

function matchCsv(){
  var f=document.getElementById('csvfile').files[0];
  var st=document.getElementById('csvStatus'), out=document.getElementById('csvResult');
  if(!f){ st.textContent=' — pehle CSV chuno'; return; }
  st.textContent=' matching…'; out.innerHTML='';
  var fd=new FormData(); fd.append('file',f);
  fetch('/api/broker-orders/csv-match?broker=kite',{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(j){
      st.textContent='';
      if(!j.ok){ out.innerHTML='<span class="match-no">⚠ '+esc(j.error||'match failed')+'</span>'; return; }
      var s=j.summary||{};
      var head=j.exact_match?'<div class="match-yes">✔ EXACT MATCH — CSV ke saare '+(s.matched||0)+' contracts broker se milte hain.</div>':'<div class="match-no">✕ MISMATCH — '+(s.mismatched||0)+' contract match nahi ('+(s.matched||0)+' match).</div>';
      var rows=(j.rows||[]).map(function(r){var c=r.match?'st-c':'st-r';return '<tr><td>'+esc(r.trad_sym)+'</td><td class="rt">'+r.csv_net+'</td><td class="rt">'+r.broker_net+'</td><td class="rt">'+r.csv_fills+' / '+r.broker_fills+'</td><td class="'+c+'">'+(r.match?'✔ match':'✕ '+esc(r.note))+'</td></tr>';}).join('');
      out.innerHTML=head+'<div class="sub" style="margin:6px 0">CSV fills '+(s.csv_fills||0)+' · broker fills '+(s.broker_fills||0)+' · contracts '+(s.contracts||0)+'</div><div class="tscroll" style="margin-top:6px"><table style="min-width:520px"><thead><tr><th>Instrument</th><th class="rt">CSV net</th><th class="rt">Broker net</th><th class="rt">Fills C/B</th><th>Match</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }).catch(function(e){ st.textContent=' ⚠ '+e; });
}

goToday();
</script>
</body>
</html>
