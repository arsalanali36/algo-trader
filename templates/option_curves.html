<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option Curves — Algo Trader</title>
  <script src="{{ url_for('static', filename='vendor/lightweight-charts.standalone.production.js') }}"></script>
  <style>
    :root{--bg:#0d1117;--panel:#161b22;--bd:#30363d;--bd2:#21262d;--tx:#e6edf3;--mut:#8b949e;
          --grn:#3fb950;--red:#f85149;--blu:#1f6feb;--org:#f0883e;--pur:#a371f7;--cyn:#39c5cf;--yel:#d29922}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;display:flex;flex-direction:column}
    .top{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--bd);background:var(--panel)}
    .title{font-size:15px;font-weight:700}
    .title .sub{font-size:11px;color:var(--mut);font-weight:500;margin-left:6px}
    .spacer{flex:1}
    a.back{color:var(--mut);text-decoration:none;font-weight:600}
    a.back:hover{color:var(--tx)}
    .wrap{flex:1;display:flex;min-height:0}
    .side{width:210px;flex-shrink:0;border-right:1px solid var(--bd);background:var(--panel);padding:12px;overflow-y:auto}
    .side label.fld{display:block;font-size:11px;color:var(--mut);font-weight:700;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
    select,input[type=date],button{background:#21262d;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer;width:100%}
    button:hover{background:#30363d}
    .seg{display:flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
    .seg button{border:none;border-radius:0;background:transparent;padding:5px 8px}
    .seg button.on{background:var(--blu);color:#fff}
    .divh{height:1px;background:var(--bd);margin:14px 0}
    .pk{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600}
    .pk:hover{background:#21262d}
    .pk input{width:auto;cursor:pointer}
    .pk .dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
    .ro{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0}
    .ro .k{color:var(--mut)}
    .ro .v{font-weight:700;font-variant-numeric:tabular-nums}
    .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
    .pane{position:relative;min-height:100px}
    .pane .lbl{position:absolute;top:6px;left:10px;z-index:3;font-size:11px;font-weight:700;color:var(--mut);pointer-events:none;background:rgba(13,17,23,.6);padding:1px 6px;border-radius:4px}
    .rh{height:6px;cursor:row-resize;background:var(--bd2);flex-shrink:0;position:relative}
    .rh:hover{background:var(--blu)}
    .rh::after{content:'';position:absolute;left:50%;top:2px;width:26px;height:2px;margin-left:-13px;background:var(--mut);border-radius:2px}
    .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mut);padding:40px;text-align:center}
  </style>
</head>
<body>
  <div class="top">
    <span class="title">📈 Option Curves<span class="sub">ATM straddle + gamma · live chain</span></span>
    <div class="spacer"></div>
    <a class="back" href="/">← Dashboard</a>
  </div>

  <div class="wrap">
    <div class="side">
      <label class="fld">Underlying</label>
      <div class="seg" id="uSeg">
        <button data-u="NIFTY" class="on" onclick="setU('NIFTY',this)">NIFTY</button>
        <button data-u="BANKNIFTY" onclick="setU('BANKNIFTY',this)">BANKNIFTY</button>
      </div>
      <label class="fld">Expiry</label>
      <select id="expiry" onchange="onStructChange()"></select>
      <label class="fld">Date</label>
      <input type="date" id="date" onchange="onStructChange()">
      <label class="fld">Timeframe</label>
      <select id="tf" onchange="onStructChange()">
        <option value="1">1 min</option>
        <option value="3">3 min</option>
        <option value="5" selected>5 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="60">1 hour</option>
      </select>
      <label class="fld">Auto-refresh</label>
      <div class="seg"><button id="autoBtn" class="on" onclick="toggleAuto()">🔄 ON</button><button onclick="refresh()">↻ Now</button></div>

      <div class="divh"></div>
      <label class="fld">Panels</label>
      <div id="panelPick"></div>

      <div class="divh"></div>
      <label class="fld">At crosshair <span id="v-time" style="color:var(--tx)"></span></label>
      <div class="ro"><span class="k">Straddle</span><span class="v" id="v-str">—</span></div>
      <div class="ro"><span class="k">Gamma</span><span class="v" id="v-gam">—</span></div>
      <div class="ro"><span class="k">Spot</span><span class="v" id="v-spot">—</span></div>
      <div class="ro"><span class="k">ATM</span><span class="v" id="v-atm">—</span></div>
      <div class="ro"><span class="k">CE | PE</span><span class="v" id="v-cepe">—</span></div>
      <div class="ro"><span class="k">VIX</span><span class="v" id="v-vix">—</span></div>
      <div class="ro"><span class="k">PCR</span><span class="v" id="v-pcr">—</span></div>
    </div>

    <div class="main" id="main"></div>
  </div>

<script>
  var LC = window.LightweightCharts;
  var U = 'NIFTY', AUTO = true, _timer = null, _syncing = false;
  var raw = [], view = [], byTime = {}, panes = [];   // panes: [{id, chart, main, spot, el}]

  // Panel catalogue — checkbox picker decides which render
  var PANELS = [
    { id:'straddle', name:'ATM Straddle', color:'#f0883e', get:function(p){return p.straddle;}, dec:2, overlay:'spot', lbl:'ATM STRADDLE PREMIUM (sell CE+PE credit) · SPOT →' },
    { id:'gamma',    name:'ATM Gamma',    color:'#a371f7', get:function(p){return p.gamma;},    dec:5, lbl:'ATM STRADDLE GAMMA (spike watch)' },
    { id:'vix',      name:'India VIX',    color:'#d29922', get:function(p){return p.vix;},      dec:2, lbl:'INDIA VIX' },
    { id:'pcr',      name:'PCR',          color:'#39c5cf', get:function(p){return p.pcr;},      dec:3, lbl:'PUT-CALL RATIO' }
  ];
  var enabled = load('oc_panels', { straddle:true, gamma:true, vix:true, pcr:true });
  var heights = load('oc_heights', {});

  function load(k, d){ try{ var v=JSON.parse(localStorage.getItem(k)); return v||d; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  (function initDate(){
    var d=new Date();
    document.getElementById('date').value = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    document.getElementById('tf').value = String(load('oc_tf', 5));
    U = load('oc_u', 'NIFTY');
    document.querySelectorAll('#uSeg button').forEach(function(b){ b.classList.toggle('on', b.dataset.u===U); });
    renderPicker();
  })();

  function renderPicker(){
    document.getElementById('panelPick').innerHTML = PANELS.map(function(p){
      return '<label class="pk"><input type="checkbox" '+(enabled[p.id]?'checked':'')+' onchange="togglePanel(\''+p.id+'\',this.checked)">'
        + '<span class="dot" style="background:'+p.color+'"></span>'+p.name+'</label>';
    }).join('');
  }
  function togglePanel(id, on){ enabled[id]=on; save('oc_panels', enabled); buildPanes(); }

  function setU(u, btn){ U=u; save('oc_u',u); document.querySelectorAll('#uSeg button').forEach(function(b){b.classList.toggle('on',b===btn);}); onStructChange(); }
  function toggleAuto(){ AUTO=!AUTO; var b=document.getElementById('autoBtn'); b.textContent='🔄 '+(AUTO?'ON':'OFF'); b.classList.toggle('on',AUTO); schedule(); }

  // Resample 1-min snapshots to the chosen TF: take the LAST snapshot in each bucket.
  function resample(pts, tfMin){
    if(tfMin<=1) return pts.slice();
    var bucket=tfMin*60, out=[], key=null, last=null;
    pts.forEach(function(p){
      var k=Math.floor(p.t/bucket);
      if(key===null) key=k;
      if(k!==key){ out.push(last); key=k; }
      last=p;
    });
    if(last) out.push(last);
    return out;
  }

  function fmt(x,d){ return (x==null||isNaN(x))?'—':Number(x).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function setv(id,v){ var e=document.getElementById(id); if(e) e.textContent=(v==null?'—':v); }

  function mkChart(el){
    return LC.createChart(el, {
      width: el.clientWidth, height: el.clientHeight,
      layout:{ background:{color:'#0d1117'}, textColor:'#8b949e', fontSize:11 },
      grid:{ vertLines:{color:'#161b22'}, horzLines:{color:'#161b22'} },
      timeScale:{ timeVisible:true, secondsVisible:false, borderColor:'#30363d' },
      rightPriceScale:{ borderColor:'#30363d' },
      leftPriceScale:{ visible:false, borderColor:'#30363d' },
      crosshair:{ mode: LC.CrosshairMode.Normal, vertLine:{color:'#484f58',labelBackgroundColor:'#21262d'}, horzLine:{color:'#484f58',labelBackgroundColor:'#21262d'} }
    });
  }

  function syncRange(src){
    if(_syncing) return; _syncing=true;
    var r=src.chart.timeScale().getVisibleLogicalRange();
    if(r) panes.forEach(function(p){ if(p!==src) p.chart.timeScale().setVisibleLogicalRange(r); });
    _syncing=false;
  }

  function onCross(param){
    var t=param&&param.time; if(t==null) return;
    var p=byTime[t]; if(!p) return;
    setv('v-str',fmt(p.straddle,2)); setv('v-gam',fmt(p.gamma,5)); setv('v-spot',fmt(p.spot,2));
    setv('v-atm',p.atm); setv('v-cepe',fmt(p.ce,2)+' | '+fmt(p.pe,2)); setv('v-vix',fmt(p.vix,2)); setv('v-pcr',fmt(p.pcr,3));
    var dt=new Date(t*1000);
    setv('v-time', dt.getUTCHours().toString().padStart(2,'0')+':'+dt.getUTCMinutes().toString().padStart(2,'0'));
  }

  function defaultH(){ var on=PANELS.filter(function(p){return enabled[p.id];}).length||1; return Math.max(120, Math.floor((document.getElementById('main').clientHeight - (on-1)*6)/on)); }

  // (Re)build the panes for the currently-enabled panels. Called ONLY on structure
  // change (panel toggle / TF / underlying / expiry / date). Auto-refresh does NOT
  // call this — it just setData()s, so the user's zoom/pan is never reset.
  function buildPanes(){
    var main=document.getElementById('main');
    panes.forEach(function(p){ try{p.chart.remove();}catch(e){} });
    panes=[]; main.innerHTML='';
    var list=PANELS.filter(function(p){ return enabled[p.id]; });
    if(!list.length){ main.innerHTML='<div class="empty">Koi panel selected nahi — left se choose karo.</div>'; return; }
    if(!view.length){ main.innerHTML='<div class="empty">'+ (_lastOk===false ? 'Is din ka option-chain data nahi mila.' : 'Data load ho raha…') +'</div>'; return; }

    list.forEach(function(def, i){
      var el=document.createElement('div'); el.className='pane';
      el.style.height=(heights[def.id]||defaultH())+'px';
      el.innerHTML='<span class="lbl">'+def.lbl+'</span>';
      main.appendChild(el);
      var chart=mkChart(el); el._chart=chart;
      var main_s=chart.addLineSeries({ color:def.color, lineWidth:2, priceLineVisible:false, lastValueVisible:true });
      var spot_s=null;
      if(def.overlay==='spot'){
        chart.applyOptions({ leftPriceScale:{ visible:true, borderColor:'#30363d' } });
        spot_s=chart.addLineSeries({ color:'#1f6feb', lineWidth:1, lineStyle:2, priceScaleId:'left', priceLineVisible:false, lastValueVisible:false });
      }
      var entry={ id:def.id, def:def, chart:chart, main:main_s, spot:spot_s, el:el };
      panes.push(entry);
      chart.timeScale().subscribeVisibleLogicalRangeChange(function(){ syncRange(entry); });
      chart.subscribeCrosshairMove(onCross);
      // resize handle (not after the last pane)
      if(i < list.length-1){
        var rh=document.createElement('div'); rh.className='rh'; main.appendChild(rh);
        (function(paneEl, id){
          rh.addEventListener('mousedown', function(e){
            e.preventDefault(); var sy=e.clientY, sh=paneEl.clientHeight;
            document.body.style.userSelect='none';
            function mv(ev){ var nh=Math.max(100, sh+(ev.clientY-sy)); paneEl.style.height=nh+'px'; if(paneEl._chart) paneEl._chart.applyOptions({height:nh, width:paneEl.clientWidth}); }
            function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); document.body.style.userSelect=''; heights[id]=paneEl.clientHeight; save('oc_heights',heights); }
            document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
          });
        })(el, def.id);
      }
    });
    applyData(true);   // first paint → fit
  }

  // Push current `view` into existing series. fit=true only on a structural rebuild;
  // auto-refresh passes fit=false → visible range (zoom) preserved.
  function applyData(fit){
    byTime={}; view.forEach(function(p){ byTime[p.t]=p; });
    panes.forEach(function(e){
      e.main.setData(view.map(function(p){ return {time:p.t, value:e.def.get(p)}; }).filter(function(d){ return d.value!=null && !isNaN(d.value); }));
      if(e.spot) e.spot.setData(view.filter(function(p){return p.spot!=null;}).map(function(p){ return {time:p.t, value:p.spot}; }));
    });
    if(fit && panes.length) panes[0].chart.timeScale().fitContent();
    if(view.length) onCross({ time: view[view.length-1].t });
  }

  var _lastOk=null, _structKey='';
  function structKey(){ return U+'|'+document.getElementById('date').value+'|'+document.getElementById('expiry').value+'|'+document.getElementById('tf').value+'|'+PANELS.filter(function(p){return enabled[p.id];}).map(function(p){return p.id;}).join(','); }

  function onStructChange(){ save('oc_tf', +document.getElementById('tf').value); refresh(true); }

  function refresh(forceBuild){
    var qs='underlying='+U+'&date='+document.getElementById('date').value;
    var ex=document.getElementById('expiry').value; if(ex) qs+='&expiry='+encodeURIComponent(ex);
    fetch('/api/option-curves?'+qs).then(function(r){return r.json();}).then(function(d){
      _lastOk = d && d.ok;
      // expiry dropdown refresh (only rebuild <option>s if the set changed)
      var sel=document.getElementById('expiry'), exps=(d&&d.expiries)||[];
      var have=Array.from(sel.options).map(function(o){return o.value;}).join(',');
      if(exps.join(',')!==have){ sel.innerHTML=exps.map(function(e){return '<option value="'+e+'">'+e+'</option>';}).join(''); sel.value=(d&&d.expiry)||(exps[0]||''); }
      else if(d&&d.expiry){ sel.value=d.expiry; }
      raw=(d&&d.points)||[];
      view=resample(raw, +document.getElementById('tf').value);
      var sk=structKey();
      if(forceBuild || sk!==_structKey || !panes.length){ _structKey=sk; buildPanes(); }
      else { applyData(false); }   // zoom preserved
    }).catch(function(e){
      document.getElementById('main').innerHTML='<div class="empty">Load fail: '+e+'</div>';
    });
    schedule();
  }

  function schedule(){ if(_timer) clearTimeout(_timer); if(AUTO) _timer=setTimeout(function(){ refresh(false); }, 30000); }

  window.addEventListener('resize', function(){
    panes.forEach(function(e){ e.chart.applyOptions({ width:e.el.clientWidth, height:e.el.clientHeight }); });
  });

  refresh(true);
</script>
</body>
</html>
