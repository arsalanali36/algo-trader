<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option Curves — Algo Trader</title>
  <script src="{{ url_for('static', filename='vendor/lightweight-charts.standalone.production.js') }}"></script>
  <style>
    :root{--bg:#0d1117;--panel:#161b22;--bd:#30363d;--bd2:#21262d;--tx:#e6edf3;--mut:#8b949e;
          --grn:#3fb950;--red:#f85149;--blu:#1f6feb;--org:#f0883e;--pur:#a371f7;--cyn:#39c5cf;--yel:#d29922}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;display:flex;flex-direction:column;overflow:hidden}
    /* Scrollbars — match the dashboard's thin dark style */
    *{scrollbar-width:thin;scrollbar-color:#30363d #0d1117}
    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:#0d1117}
    ::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:#3f4750}
    .top{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--bd);background:var(--panel)}
    .title{font-size:15px;font-weight:700}
    .title .sub{font-size:11px;color:var(--mut);font-weight:500;margin-left:6px}
    .spacer{flex:1}
    a.back{color:var(--mut);text-decoration:none;font-weight:600}
    a.back:hover{color:var(--tx)}
    .wrap{flex:1;display:flex;min-height:0}
    .side{width:210px;flex-shrink:0;border-right:1px solid var(--bd);background:var(--panel);padding:12px;overflow-y:auto}
    .side label.fld{display:block;font-size:11px;color:var(--mut);font-weight:700;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
    select,input[type=date],button{background:#21262d;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer;width:100%}
    button:hover{background:#30363d}
    .seg{display:flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
    .seg button{border:none;border-radius:0;background:transparent;padding:5px 8px}
    .seg button.on{background:var(--blu);color:#fff}
    .divh{height:1px;background:var(--bd);margin:14px 0}
    .pk{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600}
    .pk:hover{background:#21262d}
    .pk input{width:auto;cursor:pointer}
    .pk .dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
    .ro{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0}
    .ro .k{color:var(--mut)}
    .ro .v{font-weight:700;font-variant-numeric:tabular-nums}
    .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
    .pane{position:relative;min-height:100px;flex-shrink:0}
    .pane .lbl{position:absolute;top:6px;left:10px;z-index:3;font-size:11px;font-weight:700;color:var(--mut);pointer-events:none;background:rgba(13,17,23,.6);padding:1px 6px;border-radius:4px}
    .ovtick{position:absolute;top:5px;right:64px;z-index:4;font-size:10px;font-weight:600;color:var(--mut);cursor:pointer;background:rgba(13,17,23,.7);padding:1px 6px;border-radius:4px;display:flex;align-items:center;gap:4px}
    .ovtick input{cursor:pointer;margin:0}
    .rh{height:7px;cursor:row-resize;background:var(--bd2);flex-shrink:0;position:relative;z-index:6}
    .rh:hover{background:var(--blu)}
    .rh::after{content:'';position:absolute;left:50%;top:2px;width:26px;height:2px;margin-left:-13px;background:var(--mut);border-radius:2px}
    .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mut);padding:40px;text-align:center}
    .atip{position:fixed;z-index:50;display:none;background:#161b22;border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:11px;line-height:1.5;max-width:320px;color:var(--tx);pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.55)}
    .ovtick .on{color:var(--blu)}
    .imtick span{padding:0 2px}
    #notePop{position:fixed;z-index:60;display:none;background:#161b22;border:1px solid var(--bd);border-radius:8px;padding:10px;width:250px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
    #notePop textarea{width:100%;height:68px;background:#0d1117;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px;font-size:12px;resize:vertical;font-family:inherit}
    #notePop .row{display:flex;gap:6px;margin-top:8px}
    #notePop button{padding:5px 9px;font-size:12px;width:auto}
    #notePop .del{background:#3d1418;border-color:#5c1a1f;color:var(--red);margin-left:auto}
  </style>
</head>
<body>
  <div class="top">
    <span class="title">📈 Option Curves<span class="sub">ATM straddle + gamma · live chain</span></span>
    <div class="spacer"></div>
    <a class="back" href="/">← Dashboard</a>
  </div>

  <div class="wrap">
    <div class="side">
      <label class="fld">Underlying</label>
      <div class="seg" id="uSeg">
        <button data-u="NIFTY" class="on" onclick="setU('NIFTY',this)">NIFTY</button>
        <button data-u="BANKNIFTY" onclick="setU('BANKNIFTY',this)">BANKNIFTY</button>
      </div>
      <label class="fld">Expiry</label>
      <select id="expiry" onchange="onStructChange()"></select>
      <label class="fld">Date</label>
      <input type="date" id="date" onchange="onStructChange()">
      <label class="fld">Timeframe</label>
      <select id="tf" onchange="onStructChange()">
        <option value="1">1 min</option>
        <option value="3">3 min</option>
        <option value="5" selected>5 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="60">1 hour</option>
      </select>
      <label class="fld">Auto-refresh</label>
      <div class="seg"><button id="autoBtn" class="on" onclick="toggleAuto()">🔄 ON</button><button onclick="refresh()">↻ Now</button></div>

      <label class="fld">View</label>
      <div class="seg" id="viewSeg">
        <button data-v="fit" onclick="setView('fit',this)" title="Sab panes ek screen me fit">Fit</button>
        <button data-v="tall" onclick="setView('tall',this)" title="Panes lambe, page scroll">Tall</button>
      </div>
      <label class="fld">Scroll</label>
      <div class="seg" id="scrollSeg">
        <button data-s="panel" onclick="setScroll('panel',this)" title="Sirf chart area scroll (sidebar/header pinned)">Panel</button>
        <button data-s="page" onclick="setScroll('page',this)" title="Poora page scroll">Page</button>
      </div>
      <label class="fld">Index overlay</label>
      <div class="seg"><button id="idxAllBtn" onclick="toggleIndexAll(this)" title="Spot/index line saare panes pe on/off">📈 Index line: OFF</button></div>

      <div class="divh"></div>
      <label class="fld">Panels</label>
      <div id="panelPick"></div>
      <button style="margin-top:8px" onclick="resetPanes()" title="Sab panes barabar height (Alt+R)">⤢ Auto-size panes (Alt+R)</button>

      <div class="divh"></div>
      <label class="fld">At crosshair <span id="v-time" style="color:var(--tx)"></span></label>
      <div class="ro"><span class="k">Straddle</span><span class="v" id="v-str">—</span></div>
      <div class="ro"><span class="k">↳ lost (from open)</span><span class="v" id="v-slost">—</span></div>
      <div class="ro"><span class="k">Gamma</span><span class="v" id="v-gam">—</span></div>
      <div class="ro"><span class="k">Spot</span><span class="v" id="v-spot">—</span></div>
      <div class="ro"><span class="k">ATM</span><span class="v" id="v-atm">—</span></div>
      <div class="ro"><span class="k">CE | PE</span><span class="v" id="v-cepe">—</span></div>
      <div class="ro"><span class="k">VIX</span><span class="v" id="v-vix">—</span></div>
      <div class="ro"><span class="k">PCR</span><span class="v" id="v-pcr">—</span></div>
      <div class="ro"><span class="k">CE|PE OI</span><span class="v" id="v-oi">—</span></div>

      <div class="divh"></div>
      <label class="fld">Notes</label>
      <div style="font-size:11px;color:var(--mut);line-height:1.5">Kisi bhi chart pe <b>right-click</b> → note add. Marker pe hover → dikhega.</div>
      <button style="margin-top:6px" onclick="clearNotes()">🗑 Clear notes (is din ke)</button>
    </div>

    <div class="main" id="main"></div>
  </div>
  <div class="atip" id="alertTip"></div>
  <div id="notePop">
    <div style="font-size:10px;color:var(--mut);margin-bottom:4px" id="noteWhen"></div>
    <textarea id="noteTxt" placeholder="Is point pe note…"></textarea>
    <div class="row">
      <button onclick="saveNote()" style="background:var(--blu);color:#fff;border-color:var(--blu)">Save</button>
      <button onclick="closeNotePopup()">Cancel</button>
      <button class="del" id="noteDel" onclick="deleteNote()">Delete</button>
    </div>
  </div>

<script>
  var LC = window.LightweightCharts;
  var U = 'NIFTY', AUTO = true, _timer = null, _syncing = false;
  var raw = [], view = [], byTime = {}, panes = [];   // panes: [{id, chart, main, spot, el}]

  // Panel catalogue — checkbox picker decides which render. A panel can carry an
  // `extra` second line (own axis/colour): straddle→spot, OI→PE OI.
  var PANELS = [
    { id:'straddle', name:'ATM Straddle', color:'#f0883e', get:function(p){return p.straddle;}, dec:2, lbl:'ATM STRADDLE PREMIUM (sell CE+PE credit)' },
    { id:'index',    name:'Index (spot)', color:'#58a6ff', kind:'index', get:function(p){return p.spot;}, dec:2, lbl:'INDEX (SPOT) — direct chart (OHLC / line)' },
    { id:'gamma',    name:'ATM Gamma',    color:'#a371f7', get:function(p){return p.gamma;},    dec:5, lbl:'ATM STRADDLE GAMMA (spike watch)' },
    { id:'oi',       name:'OI (CE vs PE)', color:'#f85149', get:function(p){return p.ce_oi;},   dec:0, lbl:'OPEN INTEREST — CE (red) vs PE (green) · unwinding = OI girna',
      extra:{ get:function(p){return p.pe_oi;}, color:'#3fb950', axis:'right', style:0 } },
    { id:'vix',      name:'India VIX',    color:'#d29922', get:function(p){return p.vix;},      dec:2, lbl:'INDIA VIX' },
    { id:'pcr',      name:'PCR',          color:'#39c5cf', get:function(p){return p.pcr;},      dec:3, lbl:'PUT-CALL RATIO' }
  ];
  var enabled = load('oc_panels', { straddle:true, index:true, gamma:true, oi:true, vix:true, pcr:true });
  if(!('oi' in enabled)){ enabled.oi = true; save('oc_panels', enabled); }   // new OI panel → default on
  if(!('index' in enabled)){ enabled.index = true; save('oc_panels', enabled); }   // new Index panel → default on
  var heights = load('oc_heights', {});
  var rawAlerts = [], alertMarkers = {}, alertByTime = {};
  var notes = [], noteMarkers = {}, noteByTime = {};
  var overlayHidden = load('oc_overlay_hidden', {});   // panelId → true = data-overlay line hidden
  var indexMode = load('oc_index_mode', 'candle');     // Index panel: 'candle' (OHLC) | 'line'
  var indexAll  = load('oc_index_all', true);          // master: spot/index line overlaid on ALL panes
  function notesKey(){ return 'oc_notes_'+U+'_'+document.getElementById('date').value; }
  var VIEW = load('oc_view', 'fit');       // 'fit' (panes fit screen) | 'tall' (taller, scroll)
  var SCROLL = load('oc_scroll', 'panel'); // 'panel' (chart-area scroll) | 'page' (whole-page scroll)
  var TALL_H = 380;                        // fixed pane height in Tall mode

  function load(k, d){ try{ var v=JSON.parse(localStorage.getItem(k)); return v||d; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  (function initDate(){
    var d=new Date();
    var q=new URLSearchParams(location.search);
    document.getElementById('date').value = (q.get('date')) || (d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    document.getElementById('tf').value = String(load('oc_tf', 5));
    // notification/deep-link: ?underlying=NIFTY wins over the saved default
    var uq=(q.get('underlying')||'').toUpperCase();
    U = (uq==='NIFTY'||uq==='BANKNIFTY') ? uq : load('oc_u', 'NIFTY');
    document.querySelectorAll('#uSeg button').forEach(function(b){ b.classList.toggle('on', b.dataset.u===U); });
    renderPicker();
  })();

  function renderPicker(){
    document.getElementById('panelPick').innerHTML = PANELS.map(function(p){
      return '<label class="pk"><input type="checkbox" '+(enabled[p.id]?'checked':'')+' onchange="togglePanel(\''+p.id+'\',this.checked)">'
        + '<span class="dot" style="background:'+p.color+'"></span>'+p.name+'</label>';
    }).join('');
  }
  function togglePanel(id, on){ enabled[id]=on; save('oc_panels', enabled); buildPanes(); }
  function resetPanes(){ heights={}; save('oc_heights', heights); buildPanes(); }  // clear saved heights → all panes equal (defaultH)

  function setView(v, btn){ VIEW=v; save('oc_view',v); document.querySelectorAll('#viewSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v);}); heights={}; save('oc_heights',heights); buildPanes(); }
  function setScroll(s, btn){ SCROLL=s; save('oc_scroll',s); document.querySelectorAll('#scrollSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.s===s);}); applyScroll(); relayout(); }
  function applyScroll(){
    var main=document.getElementById('main');
    if(SCROLL==='page'){ document.body.style.overflowY='auto'; main.style.overflowY='visible'; }
    else { document.body.style.overflowY='hidden'; main.style.overflowY='auto'; }
  }
  function relayout(){ panes.forEach(function(e){ e.chart.applyOptions({ width:e.el.clientWidth, height:e.el.clientHeight }); }); }
  function toggleOverlay(id, show){
    overlayHidden[id]=!show; save('oc_overlay_hidden', overlayHidden);
    var e=panes.find(function(x){return x.id===id;}); if(e&&e.extra) e.extra.applyOptions({visible:!!show});
  }

  function setU(u, btn){ U=u; save('oc_u',u); document.querySelectorAll('#uSeg button').forEach(function(b){b.classList.toggle('on',b===btn);}); onStructChange(); }
  function toggleAuto(){ AUTO=!AUTO; var b=document.getElementById('autoBtn'); b.textContent='🔄 '+(AUTO?'ON':'OFF'); b.classList.toggle('on',AUTO); schedule(); }

  // Resample 1-min snapshots to the chosen TF: take the LAST snapshot in each bucket.
  function resample(pts, tfMin){
    if(tfMin<=1) return pts.slice();
    var bucket=tfMin*60, out=[], key=null, last=null;
    pts.forEach(function(p){
      var k=Math.floor(p.t/bucket);
      if(key===null) key=k;
      if(k!==key){ out.push(last); key=k; }
      last=p;
    });
    if(last) out.push(last);
    return out;
  }

  function fmt(x,d){ return (x==null||isNaN(x))?'—':Number(x).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
  // Indian short form for big numbers (OI): 8.12Cr / 50.3L / 1.2K
  function fmtInr(n){
    if(n==null||isNaN(n)) return '—';
    var a=Math.abs(n);
    if(a>=1e7) return (n/1e7).toFixed(2)+'Cr';
    if(a>=1e5) return (n/1e5).toFixed(2)+'L';
    if(a>=1e3) return (n/1e3).toFixed(1)+'K';
    return String(Math.round(n));
  }
  function setv(id,v){ var e=document.getElementById(id); if(e) e.textContent=(v==null?'—':v); }
  function paneHeight(def){ if(heights[def.id]) return heights[def.id]; return VIEW==='tall' ? TALL_H : defaultH(); }

  function mkChart(el){
    return LC.createChart(el, {
      width: el.clientWidth, height: el.clientHeight,
      layout:{ background:{color:'#0d1117'}, textColor:'#8b949e', fontSize:11 },
      grid:{ vertLines:{color:'#161b22'}, horzLines:{color:'#161b22'} },
      timeScale:{ timeVisible:true, secondsVisible:false, borderColor:'#30363d' },
      rightPriceScale:{ borderColor:'#30363d' },
      leftPriceScale:{ visible:false, borderColor:'#30363d' },
      crosshair:{ mode: LC.CrosshairMode.Normal, vertLine:{color:'#484f58',labelBackgroundColor:'#21262d'}, horzLine:{color:'#484f58',labelBackgroundColor:'#21262d'} }
    });
  }

  function syncRange(src){
    if(_syncing) return; _syncing=true;
    var r=src.chart.timeScale().getVisibleLogicalRange();
    if(r) panes.forEach(function(p){ if(p!==src) p.chart.timeScale().setVisibleLogicalRange(r); });
    _syncing=false;
  }

  function _esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }

  function onCross(param, entry){
    var t=param&&param.time;
    // alert marker hover → floating tooltip
    var tip=document.getElementById('alertTip');
    if(tip){
      var items=[];
      if(entry && t!=null && param.point){
        var al=alertByTime[entry.id+'|'+t]; if(al) items=items.concat(al.map(function(a){ return _esc(a.msg); }));
        var nt=noteByTime[entry.id+'|'+t]; if(nt) items=items.concat(nt.map(function(n){ return '📝 '+_esc(n.text); }));
      }
      if(items.length){
        tip.innerHTML = items.join('<br><br>');
        var r=entry.el.getBoundingClientRect();
        tip.style.left=Math.min(r.left+param.point.x+14, window.innerWidth-340)+'px';
        tip.style.top=(r.top+param.point.y+14)+'px';
        tip.style.display='block';
      } else { tip.style.display='none'; }
    }
    if(t==null) return;
    var p=byTime[t]; if(!p) return;
    setv('v-str',fmt(p.straddle,2)); setv('v-gam',fmt(p.gamma,5)); setv('v-spot',fmt(p.spot,2));
    setv('v-atm',p.atm); setv('v-cepe',fmt(p.ce,2)+' | '+fmt(p.pe,2)); setv('v-vix',fmt(p.vix,2)); setv('v-pcr',fmt(p.pcr,3));
    setv('v-oi', fmtInr(p.ce_oi)+' | '+fmtInr(p.pe_oi));
    // straddle value lost since day-open (positive = premium decayed = seller gained)
    var open0 = view.length ? view[0].straddle : null;
    var el=document.getElementById('v-slost');
    if(el){
      if(open0 && p.straddle!=null){
        var lost=open0-p.straddle, lpct=lost/open0*100;
        el.textContent = fmt(lost,1)+' ('+lpct.toFixed(1)+'%)';
        el.style.color = lost>=0 ? 'var(--grn)' : 'var(--red)';   // fell = decay = green
      } else { el.textContent='—'; el.style.color=''; }
    }
    var dt=new Date(t*1000);
    setv('v-time', dt.getUTCHours().toString().padStart(2,'0')+':'+dt.getUTCMinutes().toString().padStart(2,'0'));
  }

  function defaultH(){ var on=PANELS.filter(function(p){return enabled[p.id];}).length||1; return Math.max(120, Math.floor((document.getElementById('main').clientHeight - (on-1)*6)/on)); }

  // (Re)build the panes for the currently-enabled panels. Called ONLY on structure
  // change (panel toggle / TF / underlying / expiry / date). Auto-refresh does NOT
  // call this — it just setData()s, so the user's zoom/pan is never reset.
  function buildPanes(){
    var main=document.getElementById('main');
    panes.forEach(function(p){ try{p.chart.remove();}catch(e){} });
    panes=[]; main.innerHTML='';
    var list=PANELS.filter(function(p){ return enabled[p.id]; });
    if(!list.length){ main.innerHTML='<div class="empty">Koi panel selected nahi — left se choose karo.</div>'; return; }
    if(!view.length){ main.innerHTML='<div class="empty">'+ (_lastOk===false ? 'Is din ka option-chain data nahi mila.' : 'Data load ho raha…') +'</div>'; return; }

    var OVLBL={ oi:'PE' };   // data-overlay (extra series) tick label — NOT the index (index = master toggle)
    list.forEach(function(def, i){
      var el=document.createElement('div'); el.className='pane';
      el.style.height=paneHeight(def)+'px';
      var ctrl='';
      if(def.kind==='index'){
        ctrl='<span class="ovtick imtick" title="OHLC candles / line toggle" onclick="toggleIndexMode(this)">'
           + '<span class="im-c'+(indexMode==='candle'?' on':'')+'">OHLC</span><span style="opacity:.4">·</span>'
           + '<span class="im-l'+(indexMode==='line'?' on':'')+'">Line</span></span>';
      } else if(def.extra){
        var ov=OVLBL[def.id]||'overlay';
        ctrl='<label class="ovtick" title="'+ov+' line show/hide"><input type="checkbox" '
             + (overlayHidden[def.id]?'':'checked') + ' onchange="toggleOverlay(\''+def.id+'\',this.checked)">'+ov+'</label>';
      }
      el.innerHTML='<span class="lbl">'+def.lbl+'</span>'+ctrl;
      main.appendChild(el);
      var chart=mkChart(el); el._chart=chart;
      if(def.id==='oi') chart.applyOptions({ localization:{ priceFormatter: fmtInr } });   // OI axis → Cr/L
      var entry={ id:def.id, def:def, chart:chart, el:el };
      if(def.kind==='index'){
        entry.candle=chart.addCandlestickSeries({ upColor:'#3fb950', downColor:'#f85149', borderVisible:false,
          wickUpColor:'#3fb950', wickDownColor:'#f85149', visible:indexMode==='candle' });
        entry.line=chart.addLineSeries({ color:def.color, lineWidth:2, priceLineVisible:false, lastValueVisible:true,
          visible:indexMode==='line' });
        entry.main=entry.line;   // crosshair/note price reference (has data even when hidden)
      } else {
        entry.main=chart.addLineSeries({ color:def.color, lineWidth:2, priceLineVisible:false, lastValueVisible:true });
        if(def.extra){
          if(def.extra.axis==='left') chart.applyOptions({ leftPriceScale:{ visible:true, borderColor:'#30363d' } });
          entry.extra=chart.addLineSeries({ color:def.extra.color, lineWidth:1, lineStyle:(def.extra.style||0),
            priceScaleId:(def.extra.axis==='left'?'left':'right'), priceLineVisible:false, lastValueVisible:false,
            visible: !overlayHidden[def.id] });
        }
        // master index/spot overlay on its own hidden scale — toggled globally by idxAllBtn
        entry.spotOv=chart.addLineSeries({ color:'rgba(88,166,255,.55)', lineWidth:1, priceScaleId:'ocspot',
          priceLineVisible:false, lastValueVisible:false, visible:indexAll });
        chart.priceScale('ocspot').applyOptions({ scaleMargins:{top:0.12,bottom:0.12}, visible:false });
      }
      panes.push(entry);
      chart.timeScale().subscribeVisibleLogicalRangeChange(function(){ syncRange(entry); });
      chart.subscribeCrosshairMove(function(prm){ onCross(prm, entry); });
      attachNoteMenu(entry);
      // resize handle (not after the last pane)
      if(i < list.length-1){
        var rh=document.createElement('div'); rh.className='rh'; main.appendChild(rh);
        (function(paneEl, id){
          rh.addEventListener('mousedown', function(e){
            e.preventDefault(); var sy=e.clientY, sh=paneEl.clientHeight;
            document.body.style.userSelect='none';
            function mv(ev){ var nh=Math.max(100, sh+(ev.clientY-sy)); paneEl.style.height=nh+'px'; if(paneEl._chart) paneEl._chart.applyOptions({height:nh, width:paneEl.clientWidth}); }
            function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); document.body.style.userSelect=''; heights[id]=paneEl.clientHeight; save('oc_heights',heights); }
            document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
          });
        })(el, def.id);
      }
    });
    applyData(true);   // first paint → fit
  }

  // Push current `view` into existing series. fit=true only on a structural rebuild;
  // auto-refresh passes fit=false → visible range (zoom) preserved.
  function applyData(fit){
    byTime={}; view.forEach(function(p){ byTime[p.t]=p; });
    var tf=+document.getElementById('tf').value;
    var idxC = indexCandles(raw, tf);
    var spotLine = view.map(function(p){ return {time:p.t, value:p.spot}; }).filter(function(d){ return d.value!=null && !isNaN(d.value); });
    panes.forEach(function(e){
      if(e.def.kind==='index'){
        try{ e.candle.setData(idxC); }catch(x){}
        try{ e.line.setData(spotLine); }catch(x){}
      } else {
        e.main.setData(view.map(function(p){ return {time:p.t, value:e.def.get(p)}; }).filter(function(d){ return d.value!=null && !isNaN(d.value); }));
        if(e.extra) e.extra.setData(view.map(function(p){ return {time:p.t, value:e.def.extra.get(p)}; }).filter(function(d){ return d.value!=null && !isNaN(d.value); }));
        if(e.spotOv) e.spotOv.setData(spotLine);
      }
      setPaneMarkers(e);
    });
    if(fit && panes.length) panes[0].chart.timeScale().fitContent();
    if(view.length) onCross({ time: view[view.length-1].t });
  }

  // Snap each fired alert to the nearest visible bar so its circle lands on the
  // line, and index by panel|time for the hover tooltip.
  function buildAlerts(){
    alertMarkers={}; alertByTime={};
    if(!view.length || !rawAlerts.length) return;
    var vt=view.map(function(p){return p.t;});
    rawAlerts.forEach(function(a){
      var best=vt[0], bd=Infinity;
      for(var i=0;i<vt.length;i++){ var dd=Math.abs(vt[i]-a.t); if(dd<bd){bd=dd;best=vt[i];} }
      var panel=a.panel||'straddle';
      (alertMarkers[panel]=alertMarkers[panel]||[]).push({ time:best, position:'aboveBar', color:'#f85149', shape:'circle', text:a.tag||'•', size:1.4 });
      var k=panel+'|'+best; (alertByTime[k]=alertByTime[k]||[]).push(a);
    });
    Object.keys(alertMarkers).forEach(function(k){ alertMarkers[k].sort(function(a,b){return a.time-b.time;}); });
  }

  // ---- Index panel: OHLC candles built from raw 1-min spot (per TF bucket) ----
  function indexCandles(pts, tf){
    var out=[];
    if(tf<=1){ pts.forEach(function(p){ if(p.spot!=null&&!isNaN(p.spot)) out.push({time:p.t,open:p.spot,high:p.spot,low:p.spot,close:p.spot}); }); return out; }
    var bucket=tf*60, key=null, cur=null;
    pts.forEach(function(p){
      if(p.spot==null||isNaN(p.spot)) return;
      var k=Math.floor(p.t/bucket);
      if(key===null||k!==key){ if(cur) out.push(cur); key=k; cur={time:p.t,open:p.spot,high:p.spot,low:p.spot,close:p.spot}; }
      else { cur.high=Math.max(cur.high,p.spot); cur.low=Math.min(cur.low,p.spot); cur.close=p.spot; cur.time=p.t; }
    });
    if(cur) out.push(cur);
    return out;   // bar time = last t in bucket → aligns with resample() line times
  }
  function toggleIndexMode(elm){
    indexMode = indexMode==='candle' ? 'line' : 'candle'; save('oc_index_mode', indexMode);
    panes.forEach(function(e){ if(e.def.kind==='index'){ e.candle.applyOptions({visible:indexMode==='candle'}); e.line.applyOptions({visible:indexMode==='line'}); }});
    var c=elm.querySelector('.im-c'), l=elm.querySelector('.im-l');
    if(c) c.classList.toggle('on', indexMode==='candle'); if(l) l.classList.toggle('on', indexMode==='line');
  }
  function toggleIndexAll(btn){
    indexAll=!indexAll; save('oc_index_all', indexAll);
    panes.forEach(function(e){ if(e.spotOv) e.spotOv.applyOptions({visible:indexAll}); });
    btn.textContent='📈 Index line: '+(indexAll?'ON':'OFF'); btn.classList.toggle('on', indexAll);
  }

  // ---- Notes (right-click any chart point) ----
  function buildNotes(){
    noteMarkers={}; noteByTime={};
    notes.forEach(function(n){
      (noteMarkers[n.pane]=noteMarkers[n.pane]||[]).push({ time:n.t, position:'aboveBar', color:'#d29922', shape:'square', text:'📝', size:1.2 });
      var k=n.pane+'|'+n.t; (noteByTime[k]=noteByTime[k]||[]).push(n);
    });
    Object.keys(noteMarkers).forEach(function(k){ noteMarkers[k].sort(function(a,b){return a.time-b.time;}); });
  }
  function paneMarkers(id){ return (alertMarkers[id]||[]).concat(noteMarkers[id]||[]).sort(function(x,y){ return x.time-y.time; }); }
  function setPaneMarkers(e){
    var m=paneMarkers(e.id);
    try{ (e.candle||e.main).setMarkers(m); }catch(x){}
    if(e.line && e.line!==e.main){ try{ e.line.setMarkers(m); }catch(x){} }
  }
  function refreshMarkers(){ panes.forEach(setPaneMarkers); }
  function findNote(pane, t){ for(var i=0;i<notes.length;i++){ if(notes[i].pane===pane && notes[i].t===t) return notes[i]; } return null; }

  function attachNoteMenu(entry){
    entry.el.addEventListener('contextmenu', function(e){
      e.preventDefault();
      if(!view.length) return;
      var rect=entry.el.getBoundingClientRect();
      var x=e.clientX-rect.left, y=e.clientY-rect.top;
      var t=null; try{ t=entry.chart.timeScale().coordinateToTime(x); }catch(x2){}
      if(t==null) return;
      var price=null; try{ price=entry.main.coordinateToPrice(y); }catch(x3){}
      var vt=view.map(function(p){return p.t;}), best=vt[0], bd=Infinity;
      for(var i=0;i<vt.length;i++){ var dd=Math.abs(vt[i]-t); if(dd<bd){bd=dd;best=vt[i];} }
      openNotePopup(entry.id, best, price, e.clientX, e.clientY);
    });
  }
  var _noteCtx=null;
  function openNotePopup(pane, t, price, cx, cy){
    var pop=document.getElementById('notePop'), ta=document.getElementById('noteTxt'), del=document.getElementById('noteDel');
    var existing=findNote(pane, t);
    _noteCtx={ pane:pane, t:t, price:price, editing:existing };
    ta.value = existing ? existing.text : '';
    del.style.display = existing ? 'inline-block' : 'none';
    var dt=new Date(t*1000);
    document.getElementById('noteWhen').textContent = pane+' · '+dt.getUTCHours().toString().padStart(2,'0')+':'+dt.getUTCMinutes().toString().padStart(2,'0');
    pop.style.left=Math.min(cx, window.innerWidth-270)+'px';
    pop.style.top=Math.min(cy, window.innerHeight-180)+'px';
    pop.style.display='block'; ta.focus();
  }
  function closeNotePopup(){ var p=document.getElementById('notePop'); if(p) p.style.display='none'; _noteCtx=null; }
  function saveNote(){
    if(!_noteCtx) return;
    var txt=document.getElementById('noteTxt').value.trim();
    if(!txt){ closeNotePopup(); return; }
    if(_noteCtx.editing){ _noteCtx.editing.text=txt; }
    else { notes.push({ id:'n'+_noteCtx.t+'_'+notes.length, pane:_noteCtx.pane, t:_noteCtx.t, price:_noteCtx.price, text:txt }); }
    save(notesKey(), notes); buildNotes(); refreshMarkers(); closeNotePopup();
  }
  function deleteNote(){
    if(!_noteCtx||!_noteCtx.editing){ closeNotePopup(); return; }
    notes=notes.filter(function(n){ return n!==_noteCtx.editing; });
    save(notesKey(), notes); buildNotes(); refreshMarkers(); closeNotePopup();
  }
  function clearNotes(){
    if(!notes.length) return;
    if(!confirm('Is din ke saare notes hata dein?')) return;
    notes=[]; save(notesKey(), notes); buildNotes(); refreshMarkers();
  }

  var _lastOk=null, _structKey='';
  function structKey(){ return U+'|'+document.getElementById('date').value+'|'+document.getElementById('expiry').value+'|'+document.getElementById('tf').value+'|'+PANELS.filter(function(p){return enabled[p.id];}).map(function(p){return p.id;}).join(','); }

  function onStructChange(){ save('oc_tf', +document.getElementById('tf').value); refresh(true); }

  function refresh(forceBuild){
    var date=document.getElementById('date').value;
    var qs='underlying='+U+'&date='+date;
    var ex=document.getElementById('expiry').value; if(ex) qs+='&expiry='+encodeURIComponent(ex);
    Promise.all([
      fetch('/api/option-curves?'+qs).then(function(r){return r.json();}),
      fetch('/api/option-alerts?underlying='+U+'&date='+date).then(function(r){return r.json();}).catch(function(){return {alerts:[]};})
    ]).then(function(res){
      var d=res[0], ad=res[1];
      _lastOk = d && d.ok;
      var sel=document.getElementById('expiry'), exps=(d&&d.expiries)||[];
      var have=Array.from(sel.options).map(function(o){return o.value;}).join(',');
      if(exps.join(',')!==have){ sel.innerHTML=exps.map(function(e){return '<option value="'+e+'">'+e+'</option>';}).join(''); sel.value=(d&&d.expiry)||(exps[0]||''); }
      else if(d&&d.expiry){ sel.value=d.expiry; }
      raw=(d&&d.points)||[];
      view=resample(raw, +document.getElementById('tf').value);
      rawAlerts=(ad&&ad.alerts)||[];
      buildAlerts();
      notes=load(notesKey(),[]); buildNotes();
      var sk=structKey();
      if(forceBuild || sk!==_structKey || !panes.length){ _structKey=sk; buildPanes(); }
      else { applyData(false); }   // zoom preserved
    }).catch(function(e){
      document.getElementById('main').innerHTML='<div class="empty">Load fail: '+e+'</div>';
    });
    schedule();
  }

  function schedule(){ if(_timer) clearTimeout(_timer); if(AUTO) _timer=setTimeout(function(){ refresh(false); }, 30000); }

  window.addEventListener('resize', relayout);

  // Alt+R: Fit view → equal panel heights; Tall view → reset chart zoom only (panels untouched)
  window.addEventListener('keydown', function(e){
    if(e.altKey && (e.key==='r' || e.key==='R')){
      e.preventDefault();
      if(VIEW==='tall'){ panes.forEach(function(p){ try{ p.chart.timeScale().fitContent(); }catch(x){} }); }
      else { resetPanes(); }
    }
  });

  // init the View / Scroll segmented buttons to saved state
  document.querySelectorAll('#viewSeg button').forEach(function(b){ b.classList.toggle('on', b.dataset.v===VIEW); });
  document.querySelectorAll('#scrollSeg button').forEach(function(b){ b.classList.toggle('on', b.dataset.s===SCROLL); });
  applyScroll();

  // init master index-overlay button + close note popup on outside click
  (function(){ var b=document.getElementById('idxAllBtn'); if(b){ b.textContent='📈 Index line: '+(indexAll?'ON':'OFF'); b.classList.toggle('on', indexAll); } })();
  document.addEventListener('mousedown', function(e){ var p=document.getElementById('notePop'); if(p && p.style.display==='block' && !p.contains(e.target)) closeNotePopup(); });

  refresh(true);
</script>
