<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Algo Trader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: #161b22; border: 1px solid #30363d; border-radius: 12px;
      padding: 32px 28px; width: 100%; max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    .title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #8b949e; margin-bottom: 22px; }
    label { display: block; font-size: 12px; color: #8b949e; margin: 14px 0 6px; font-weight: 600; }
    input {
      width: 100%; padding: 10px 12px; background: #0d1117;
      border: 1px solid #30363d; border-radius: 6px; color: #e6edf3;
      font-size: 14px; outline: none;
    }
    input:focus { border-color: #1f6feb; }
    button {
      width: 100%; margin-top: 22px; padding: 11px; background: #1f6feb;
      border: none; border-radius: 6px; color: #fff; font-size: 14px;
      font-weight: 600; cursor: pointer;
    }
    button:hover { background: #388bfd; }
    .err {
      background: #f8514922; border: 1px solid #f85149; color: #ff9b95;
      border-radius: 6px; padding: 9px 12px; font-size: 13px; margin-bottom: 16px;
    }
    .note {
      background: #d2992222; border: 1px solid #d29922; color: #e3b341;
      border-radius: 6px; padding: 9px 12px; font-size: 12px; margin-bottom: 16px;
      line-height: 1.5;
    }
    .lock { font-size: 26px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <div class="lock">🔒</div>
    <div class="title">Algo Trader</div>
    <div class="sub">Sign in to continue</div>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    {% if not configured %}
      <div class="note">
        ⚠️ No password set yet. On the server run:<br>
        <code>python set_password.py &lt;username&gt; &lt;password&gt;</code>
      </div>
    {% endif %}

    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autofocus>

    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password">

    <button type="submit">Sign in</button>
  </form>
</body>
</html>
