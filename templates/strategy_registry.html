<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Registry — CODE3B</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#21262d;--bd:#30363d;--tx:#e6edf3;--mut:#8b949e;
        --green:#3fb950;--red:#f85149;--blue:#58a6ff;--amber:#d29922;--dim:#6e7681}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
  .head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:22px;margin:0}
  .sub{color:var(--mut);font-size:12.5px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 8px}
  .bar input{background:var(--panel);border:1px solid var(--bd);color:var(--tx);border-radius:7px;padding:7px 11px;font-size:13px;min-width:220px}
  .chip{background:var(--panel2);border:1px solid var(--bd);color:var(--mut);border-radius:14px;padding:4px 11px;font-size:11.5px;cursor:pointer;user-select:none}
  .chip.on{background:#1f6feb22;border-color:var(--blue);color:var(--blue)}
  .fam{margin-top:20px}
  .famhd{display:flex;align-items:baseline;gap:10px;padding:8px 2px 6px;border-bottom:1px solid var(--bd)}
  .famhd .fid{font-weight:800;color:var(--blue);font-size:15px;letter-spacing:.4px}
  .famhd .fnm{font-weight:700;font-size:14.5px}
  .famhd .fds{color:var(--mut);font-size:12px}
  table{width:100%;border-collapse:collapse;margin-top:4px}
  td,th{padding:8px 10px;border-bottom:1px solid #21262d;text-align:left;vertical-align:top}
  th{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .id{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--blue);white-space:nowrap}
  .nm{font-weight:600}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut)}
  .st{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:11px;white-space:nowrap;text-transform:uppercase}
  .st.paper{background:#1f6feb22;color:var(--blue)} .st.live{background:#23863622;color:var(--green)}
  .st.research{background:#8b949e22;color:var(--mut)} .st.rejected{background:#da363322;color:var(--red)}
  .st.failed{background:#d2992222;color:var(--amber)} .st.legacy{background:#6e768122;color:var(--dim)}
  a.lnk{color:var(--blue);text-decoration:none;font-size:12px} a.lnk:hover{text-decoration:underline}
  .empty{color:var(--mut);padding:30px;text-align:center}
</style></head>
<body><div class="wrap">
  <div class="head"><h1>🗂️ Strategy Registry</h1><span class="sub" id="sub"></span></div>
  <div class="sub">One place for every strategy — deployed, research, legacy, backtest. Canonical
    <b>family.member</b> ID (e.g. <span class="id">00.01</span>) is the SAME identity shown in Logs,
    RMS, Positions, Reports &amp; the Lab. New strategies register via <span class="mono">strategy_registry.add()</span>.</div>
  <div class="bar">
    <input id="q" placeholder="🔍 search id / name / config-key / file…" oninput="render()">
    <span id="filters"></span>
  </div>
  <div id="tree"></div>
</div>
<script>
let REG={families:{},strategies:{}}, CFG={}, HIDE={};
const STATUSES=['paper','live','research','rejected','failed','legacy'];
async function load(){
  try{const r=await fetch('/api/strategy-registry',{cache:'no-store'});REG=await r.json();}catch(e){}
  try{const r=await fetch('/api/config',{cache:'no-store'});CFG=await r.json();}catch(e){}
  const strs=REG.strategies||{};
  document.getElementById('sub').textContent=Object.keys(strs).length+' strategies · '+Object.keys(REG.families||{}).length+' families';
  const fbox=document.getElementById('filters');
  fbox.innerHTML='<span class="chip on" data-st="all" onclick="tog(this)">all</span>'+
    STATUSES.map(s=>`<span class="chip on" data-st="${s}" onclick="tog(this)">${s}</span>`).join('');
  render();
}
function tog(el){const s=el.dataset.st;
  if(s==='all'){HIDE={};document.querySelectorAll('.chip').forEach(c=>c.classList.add('on'));}
  else{HIDE[s]=!HIDE[s];el.classList.toggle('on',!HIDE[s]);
    const allon=STATUSES.every(x=>!HIDE[x]);const a=document.querySelector('.chip[data-st=all]');if(a)a.classList.toggle('on',allon);}
  render();
}
function liveStatus(ck){ // real live/paper/stopped from config, if this strategy has a config key
  if(!ck||!CFG[ck])return null; const c=CFG[ck]||{};
  return c.active?(c.mode||'paper'):'off';
}
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const fams=REG.families||{}, strs=REG.strategies||{};
  const byFam={};
  for(const id in strs){const s=strs[id]; const fid=id.split('.')[0]; (byFam[fid]=byFam[fid]||[]).push({id,...s});}
  let html='', shown=0;
  Object.keys(fams).sort().forEach(fid=>{
    let mem=(byFam[fid]||[]).sort((a,b)=>a.id<b.id?-1:1)
      .filter(m=>!HIDE[m.status])
      .filter(m=>!q || (m.id+' '+(m.name||'')+' '+(m.config_key||'')+' '+(m.slug||'')+' '+(m.live_file||'')).toLowerCase().includes(q));
    if(!mem.length)return; shown+=mem.length;
    const f=fams[fid]||{};
    html+=`<div class="fam"><div class="famhd"><span class="fid">${fid}</span><span class="fnm">${f.name||fid}</span><span class="fds">${f.desc||''}</span></div>
      <table><tr><th>ID</th><th>Name</th><th>Status</th><th>Config key</th><th>File</th><th>Open</th></tr>`;
    mem.forEach(m=>{
      const live=liveStatus(m.config_key);
      const liveTag=live?` <span class="st ${live==='off'?'legacy':(live==='live'?'live':'paper')}" title="running now">${live==='off'?'stopped':live+' now'}</span>`:'';
      const links=[];
      if(m.slug) links.push(`<a class="lnk" href="/lab/runs/${m.slug}/index.html" target="_blank">Lab ↗</a>`);
      html+=`<tr>
        <td class="id">${m.id}</td>
        <td class="nm">${m.name||''}</td>
        <td><span class="st ${m.status||'research'}">${m.status||'research'}</span>${liveTag}</td>
        <td class="mono">${m.config_key||'—'}</td>
        <td class="mono">${(m.live_file||'—').replace('strategies/','').replace('_core/','')}</td>
        <td>${links.join(' ')||'—'}</td></tr>`;
    });
    html+='</table></div>';
  });
  document.getElementById('tree').innerHTML=shown?html:'<div class="empty">No strategies match.</div>';
}
load();
</script></body></html>
