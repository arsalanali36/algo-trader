<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Study</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#0f141b;--bd:#30363d;--bd2:#21262d;--tx:#e6edf3;
    --mut:#8b949e;--dim:#6e7681;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--amber:#d29922;--purple:#a371f7;--acc:#1f6feb;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  a{color:var(--blue);text-decoration:none}
  .num{font-variant-numeric:tabular-nums}
  .top{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#11161d,#0d1117);position:sticky;top:0;z-index:40;flex-wrap:wrap}
  .brand b{font-size:14px}
  .lnk{border:1px solid var(--bd);background:var(--panel);border-radius:7px;padding:5px 10px;color:var(--tx);font-weight:600;font-size:12px;cursor:pointer}
  .lnk.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .seg{display:inline-flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--mut);font:inherit;font-weight:600;padding:5px 10px;cursor:pointer;border-left:1px solid var(--bd)}
  .seg button:first-child{border-left:0}
  .seg button.on{background:var(--acc);color:#fff}
  .lab{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
  .sp{flex:1}
  .agg{display:flex;gap:16px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--bd);background:var(--panel2)}
  .agg .k{color:var(--dim);font-size:10px;text-transform:uppercase}
  .agg .v{font-size:15px;font-weight:700}
  .fields{padding:10px 14px;border-bottom:1px solid var(--bd);background:#12161d}
  .fields .h{font-size:11px;color:var(--dim);margin-bottom:7px}
  .fields .list{display:flex;flex-wrap:wrap;gap:7px 14px}
  .fields label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#adbac7;cursor:pointer}
  .fields input{accent-color:var(--acc);width:14px;height:14px}
  #grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
  #grid.single{grid-template-columns:1fr}
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;overflow:hidden;break-inside:avoid}
  .card.win{border-color:rgba(63,185,80,.35)} .card.loss{border-color:rgba(248,81,73,.35)}
  .chd{padding:7px 11px;border-bottom:1px solid var(--bd2)}
  .chd .r1{display:flex;align-items:center;gap:8px}
  .chd .sym{font-weight:700;font-size:13px} .chd .dt{color:var(--dim);font-size:11px}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
  .badge.win{background:rgba(63,185,80,.14);color:var(--green)} .badge.loss{background:rgba(248,81,73,.14);color:var(--red)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .chip{font-size:11px;color:var(--dim);background:var(--panel2);border:1px solid var(--bd2);border-radius:5px;padding:1px 7px}
  .chip b{font-weight:600;color:var(--tx)}
  .paneLab{font-size:9px;color:var(--dim);padding:3px 11px 0;text-transform:uppercase;letter-spacing:.4px}
  svg.chart{width:100%;display:block}
  .rsiWrap{background:var(--panel2)}
  .load{padding:26px;text-align:center;color:var(--mut);font-size:12px;cursor:pointer}
  .load:hover{color:var(--tx)}
  .empty{padding:60px 20px;text-align:center;color:var(--mut)}
  .prog{font-size:11px;color:var(--amber)}
  @media print{
    @page{size:landscape;margin:8mm}
    .top,.fields,#progress{display:none!important}
    body{background:#fff}
    .card{break-inside:avoid;page-break-inside:avoid}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  .port #grid{max-width:820px;margin:0 auto}
</style></head><body>

<div class="top">
  <div class="brand"><b>📄 <span id="ttl">Strategy Study</span></b></div>
  <span id="range" style="color:var(--dim);font-size:11px"></span>
  <span class="sp"></span>
  <span class="lab">Page</span>
  <div class="seg" id="segPage"><button data-v="double" class="on">Double</button><button data-v="single">Single</button></div>
  <span class="lab">Orient</span>
  <div class="seg" id="segOrient"><button data-v="land" class="on">Horizontal</button><button data-v="port">Vertical</button></div>
  <span class="lab">Chart</span>
  <div class="seg" id="segChart"><button data-v="both" class="on">Both</button><button data-v="index">Index</button><button data-v="premium">Premium</button></div>
  <button class="lnk" id="gearBtn">⚙ Fields</button>
  <button class="lnk" id="loadAll">⤓ Load all</button>
  <button class="lnk" id="printBtn">🖨 PDF</button>
  <a class="lnk" href="/">← Dashboard</a>
</div>

<div class="fields" id="fields" style="display:none">
  <div class="h">Chart header pe kya dikhe — tick karo</div>
  <div class="list" id="fieldList"></div>
</div>

<div class="agg" id="agg"></div>
<div id="progress" style="padding:6px 14px;display:none" class="prog"></div>
<div id="grid"></div>
<div class="empty" id="empty" style="display:none">Is strategy ke koi completed trade nahi mile (date range me).</div>

<script>{% raw %}
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const STRAT=qs.get('strategy')||'', NAME=qs.get('name')||STRAT||'All', FROM=qs.get('from')||'', TO=qs.get('to')||'';
const G='#3fb950',R='#f85149',PUR='#a371f7',AM='#d29922',BL='#58a6ff';

const FIELDS=[['time','In/Out time',1],['dur','Duration',1],['entry','Entry ₹',1],['exit','Exit ₹',1],
  ['pts','Points',1],['pct','% return',1],['pnl','P&L ₹',1],['rsi','RSI @ entry',1],
  ['qty','Qty',0],['lots','Lots',0],['side','Side CE/PE',0]];
let FON={};
try{FON=JSON.parse(localStorage.getItem('study_fields')||'null')||null;}catch(e){FON=null;}
if(!FON){FON={};FIELDS.forEach(f=>FON[f[0]]=!!f[2]);}
function saveFields(){localStorage.setItem('study_fields',JSON.stringify(FON));}

let CFG={page:localStorage.getItem('study_page')||'double',orient:localStorage.getItem('study_orient')||'land',chart:localStorage.getItem('study_chart')||'both'};
function applyCfg(){
  $('grid').className = CFG.page==='single'?'single':'';
  document.body.classList.toggle('port', CFG.orient==='port');
  [['segPage','page'],['segOrient','orient'],['segChart','chart']].forEach(([id,k])=>{
    [...$(id).children].forEach(b=>b.classList.toggle('on', b.dataset.v===CFG[k]));
  });
  // re-render already-loaded charts for chart-source toggle
  document.querySelectorAll('.card[data-loaded="1"]').forEach(c=>drawCard(c, JSON.parse(c.dataset.payload)));
}
[['segPage','page'],['segOrient','orient'],['segChart','chart']].forEach(([id,k])=>{
  $(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;CFG[k]=b.dataset.v;localStorage.setItem('study_'+k,b.dataset.v);applyCfg();});
});
$('gearBtn').addEventListener('click',()=>{const f=$('fields');f.style.display=f.style.display==='none'?'block':'none';});
$('printBtn').addEventListener('click',async()=>{ await loadAll(); window.print(); });
$('loadAll').addEventListener('click',loadAll);

$('fieldList').innerHTML=FIELDS.map(f=>`<label><input type="checkbox" data-f="${f[0]}" ${FON[f[0]]?'checked':''}> ${f[1]}</label>`).join('');
$('fieldList').addEventListener('change',e=>{if(e.target.dataset.f){FON[e.target.dataset.f]=e.target.checked;saveFields();
  document.querySelectorAll('.card[data-loaded="1"]').forEach(c=>{c.querySelector('.chips').innerHTML=chipHtml(JSON.parse(c.dataset.trade), JSON.parse(c.dataset.payload));});}});

function fmt(v,d=2){return (v==null||isNaN(v))?'—':Number(v).toLocaleString('en-IN',{maximumFractionDigits:d});}
function dur(t){
  if(!t.entry_time||!t.exit_time)return '—';
  const [eh,em]=t.entry_time.split(':').map(Number),[xh,xm]=t.exit_time.split(':').map(Number);
  let mins=(xh*60+xm)-(eh*60+em);
  const dd=(t.exit_date&&t.date&&t.exit_date>t.date)?Math.round((new Date(t.exit_date)-new Date(t.date))/864e5):0;
  mins+=dd*375; // approx trading-day minutes; good enough for a duration chip
  if(mins<0)mins+=375;
  if(dd>0)return dd+'d '+Math.floor((mins%375)/60)+'h';
  return mins>=60?Math.floor(mins/60)+'h '+(mins%60)+'m':mins+'m';
}
function rsiAtEntry(payload){
  const rs=payload.idx&&payload.idx.rsi&&payload.idx.rsi.series, mk=payload.idx&&payload.idx.entry_mk;
  if(!rs||!rs.length||!mk)return null;
  let best=rs[0],bd=1e18; for(const p of rs){const d=Math.abs(p.time-mk);if(d<bd){bd=d;best=p;}}
  return best.value;
}
function chipHtml(t,payload){
  const cpl=k=>k==='pnl'||k==='pts'||k==='pct';
  const rsiE=rsiAtEntry(payload);
  const V={time:(t.entry_time&&t.exit_time)?t.entry_time+'→'+t.exit_time:'—', dur:dur(t),
    entry:fmt(t.entry_price), exit:fmt(t.exit_price), pts:(t.points>=0?'+':'')+fmt(t.points),
    pct:(t.pct>=0?'+':'')+fmt(t.pct,1)+'%', pnl:(t.pnl>=0?'+₹':'−₹')+fmt(Math.abs(t.pnl),0),
    rsi:rsiE==null?'—':fmt(rsiE,0), qty:t.qty, lots:(t.lots==null?'—':t.lots), side:t.opt||t.side};
  const LAB={time:'',dur:'⏱',entry:'in',exit:'out',pts:'pt',pct:'',pnl:'',rsi:'RSI',qty:'qty',lots:'lot',side:''};
  return FIELDS.filter(f=>FON[f[0]]).map(f=>{const k=f[0];const col=cpl(k)?(t.win?G:R):'var(--tx)';
    return `<span class="chip">${LAB[k]?LAB[k]+' ':''}<b style="color:${col}">${V[k]}</b></span>`;}).join('');
}

function scaleCandles(cs){let mn=1e18,mx=-1e18;cs.forEach(c=>{mn=Math.min(mn,c.low);mx=Math.max(mx,c.high);});
  if(mx<=mn)mx=mn+1;const pad=(mx-mn)*0.06;return {mn:mn-pad,mx:mx+pad};}
function drawCandles(cs,entryMk,exitMk,side){
  if(!cs||!cs.length)return '<div class="load">no data</div>';
  const W=560,H=150,{mn,mx}=scaleCandles(cs);const n=cs.length,cw=Math.max(1.5,Math.min(9,(W-8)/n-1.5)),step=(W-8)/n;
  const y=v=>H-6-((v-mn)/(mx-mn))*(H-12);const x=i=>4+i*step+step/2;
  let o='';cs.forEach((c,i)=>{const up=c.close>=c.open,col=up?G:R,cx=x(i);
    o+=`<line x1="${cx.toFixed(1)}" y1="${y(c.high).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${y(c.low).toFixed(1)}" stroke="${col}" stroke-width="0.7"/>`;
    const yo=y(c.open),yc=y(c.close);o+=`<rect x="${(cx-cw/2).toFixed(1)}" y="${Math.min(yo,yc).toFixed(1)}" width="${cw.toFixed(1)}" height="${(Math.abs(yo-yc)||1).toFixed(1)}" fill="${col}"/>`;});
  const idxAt=mk=>{let bi=-1,bd=1e18;cs.forEach((c,i)=>{const d=Math.abs(c.time-mk);if(d<bd){bd=d;bi=i;}});return bi;};
  const dirCol=side==='SELL'?R:G;
  if(entryMk){const i=idxAt(entryMk),cx=x(i);o+=`<line x1="${cx.toFixed(1)}" y1="0" x2="${cx.toFixed(1)}" y2="${H}" stroke="${BL}" stroke-width="0.7" stroke-dasharray="3 3"/>`+
    `<polygon points="${cx-4},${H-4} ${cx+4},${H-4} ${cx},${H-12}" fill="${BL}"/>`;}
  if(exitMk){const i=idxAt(exitMk),cx=x(i);o+=`<polygon points="${cx-4},12 ${cx+4},12 ${cx},4" fill="${dirCol}"/>`;}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${o}</svg>`;
}
function drawRsi(rsi){
  if(!rsi||!rsi.series||!rsi.series.length)return '';
  const W=560,H=52,ser=rsi.series,ly=v=>H-((v)/100)*H;
  const t0=ser[0].time,t1=ser[ser.length-1].time,span=(t1-t0)||1;const px=t=>((t-t0)/span)*W;
  let d='';ser.forEach((p,i)=>{d+=(i?'L':'M')+px(p.time).toFixed(1)+' '+ly(p.value).toFixed(1)+' ';});
  const lvl=(v,c,dash)=>`<line x1="0" y1="${ly(v).toFixed(1)}" x2="${W}" y2="${ly(v).toFixed(1)}" stroke="${c}" stroke-width="0.7" ${dash?'stroke-dasharray="4 3"':''}/>`;
  return `<div class="rsiWrap"><div class="paneLab">RSI(${rsi.period}) ${rsi.tf}</div><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${lvl(rsi.ob,R,1)}${lvl(rsi.mid,AM,0)}${lvl(rsi.os,G,1)}<path d="${d}" fill="none" stroke="${PUR}" stroke-width="1.4"/></svg></div>`;
}
function drawPrem(cs,win){
  if(!cs||!cs.length)return '<div class="load">no premium data</div>';
  const W=560,H=70,{mn,mx}=scaleCandles(cs);const y=v=>H-4-((v-mn)/(mx-mn))*(H-8);const step=(W-8)/cs.length;
  let d='';cs.forEach((c,i)=>{d+=(i?'L':'M')+(4+i*step+step/2).toFixed(1)+' '+y(c.close).toFixed(1)+' ';});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${win?G:R}" stroke-width="1.5"/></svg>`;
}

function drawCard(card,payload){
  const t=JSON.parse(card.dataset.trade);
  let body='';
  const showIdx=CFG.chart==='both'||CFG.chart==='index', showPrem=CFG.chart==='both'||CFG.chart==='premium';
  if(showIdx){body+=`<div class="paneLab">Index · ${t.root}</div>`+drawCandles((payload.idx&&payload.idx.candles)||[],payload.idx&&payload.idx.entry_mk,payload.idx&&payload.idx.exit_mk,t.side)+drawRsi(payload.idx&&payload.idx.rsi);}
  if(showPrem){body+=`<div class="paneLab">Premium · ${t.opt||t.side}</div>`+drawPrem((payload.prem&&payload.prem.candles)||[],t.win);}
  card.querySelector('.body').innerHTML=body;
  card.querySelector('.chips').innerHTML=chipHtml(t,payload);
}

async function loadCard(card){
  if(card.dataset.loaded==='1'||card.dataset.loading==='1')return;
  card.dataset.loading='1';
  const t=JSON.parse(card.dataset.trade);
  const q=`trad_sym=${encodeURIComponent(t.sym)}&date=${t.date}&et=${encodeURIComponent(t.entry_time)}&xt=${encodeURIComponent(t.exit_time)}&strategy=${encodeURIComponent(t.strategy||STRAT)}`;
  let prem=null,idx=null;
  try{prem=await (await fetch('/api/trade-chart-data?'+q)).json();}catch(e){}
  try{idx=await (await fetch('/api/trade-chart-underlying-data?'+q)).json();}catch(e){}
  const payload={prem:prem&&prem.ok?prem:{candles:[]}, idx:idx&&idx.ok?idx:{candles:[]}};
  card.dataset.payload=JSON.stringify(payload);
  card.dataset.loaded='1';card.dataset.loading='0';
  drawCard(card,payload);
}
async function loadAll(){
  const cards=[...document.querySelectorAll('.card')];const p=$('progress');p.style.display='block';
  let done=0;for(const c of cards){if(c.dataset.loaded!=='1'){await loadCard(c);} done++;p.textContent=`loading charts… ${done}/${cards.length}`;}
  p.textContent=`✓ ${cards.length} trades loaded`;setTimeout(()=>p.style.display='none',1500);
}

const io=new IntersectionObserver((ents)=>{ents.forEach(e=>{if(e.isIntersecting)loadCard(e.target);});},{rootMargin:'300px'});

function cardHtml(t){
  const cls=t.win?'win':'loss';
  return `<div class="card ${cls}" data-trade='${JSON.stringify(t).replace(/'/g,"&#39;")}'>
    <div class="chd"><div class="r1"><span class="sym">${t.root}</span><span class="dt">${t.date} · ${t.opt||t.side}</span><span class="sp" style="flex:1"></span>
      <span class="badge ${cls}">${t.win?'WIN':'LOSS'} ${(t.pnl>=0?'+₹':'−₹')+fmt(Math.abs(t.pnl),0)}</span></div>
      <div class="chips"></div></div>
    <div class="body"><div class="load" onclick="loadCard(this.closest('.card'))">tap / scroll to load chart</div></div>
  </div>`;
}

async function init(){
  $('ttl').textContent=NAME+' — study';
  let r;try{r=await (await fetch(`/api/strategy-study/trades?strategy=${encodeURIComponent(STRAT)}&name=${encodeURIComponent(NAME)}&from=${FROM}&to=${TO}`)).json();}catch(e){r={ok:false};}
  if(!r.ok){$('empty').style.display='block';$('empty').textContent='load fail';return;}
  $('range').textContent=r.from+' → '+r.to;
  const a=r.agg;
  $('agg').innerHTML=[['Trades',a.trades,''],['Win %',a.win_pct+'%',a.win_pct>=50?'color:var(--green)':'color:var(--red)'],
    ['Net',(a.net>=0?'+₹':'−₹')+fmt(Math.abs(a.net),0),a.net>=0?'color:var(--green)':'color:var(--red)'],
    ['PF',a.pf==null?'—':a.pf,''],['Avg win','+₹'+fmt(a.avg_win,0),'color:var(--green)'],
    ['Avg loss','−₹'+fmt(a.avg_loss,0),'color:var(--red)'],['W/L',a.wins+' / '+a.losses,'']]
    .map(([k,v,st])=>`<div><div class="k">${k}</div><div class="v" style="${st}">${v}</div></div>`).join('');
  if(!r.trades.length){$('empty').style.display='block';return;}
  $('grid').innerHTML=r.trades.map(cardHtml).join('');
  applyCfg();
  document.querySelectorAll('.card').forEach(c=>io.observe(c));
}
init();
{% endraw %}</script>
</body></html>
