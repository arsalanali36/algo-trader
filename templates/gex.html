<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEX Profile</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --bd:#30363d; --bd2:#21262d;
    --tx:#e6edf3; --mut:#8b949e; --dim:#6e7681;
    --green:#3fb950; --red:#f85149; --blue:#1f6feb; --amber:#d29922;
    --spot:#f0883e; --purple:#a371f7;
    --greenA:rgba(63,185,80,.16); --redA:rgba(248,81,73,.16);
    --callA:rgba(88,166,255,.14); --putA:rgba(240,136,62,.13);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:13px;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  a{color:var(--blue);text-decoration:none}
  .top{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--bd);
    background:linear-gradient(180deg,#11161d,#0d1117);flex-wrap:wrap;
    position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand b{font-size:15px;letter-spacing:.2px}
  .brand span{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.7px}
  .top .sp{flex:1}
  .seg{display:inline-flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--mut);font:inherit;font-weight:600;padding:5px 12px;cursor:pointer}
  .seg button.on{background:var(--blue);color:#fff}
  .ctl{border:1px solid var(--bd);background:var(--bd2);border-radius:7px;padding:5px 9px;color:var(--tx);font:inherit}
  .ctl small{color:var(--mut);font-weight:500;margin-right:6px;text-transform:uppercase;font-size:10px;letter-spacing:.5px}
  .ctl.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  button.ctl{cursor:pointer;font-weight:600}
  select.ctl,input.ctl{cursor:pointer}
  input[type=date].ctl{color-scheme:dark}
  .kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bd);border-bottom:1px solid var(--bd)}
  .kpi{background:var(--panel);padding:10px 14px}
  .kpi .lab{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
  .kpi .val{font-size:19px;font-weight:700}
  .kpi .val small{font-size:11px;color:var(--mut);font-weight:500}
  .regime{display:flex;align-items:center;gap:12px;padding:9px 16px;font-size:12.5px;border-bottom:1px solid var(--bd)}
  .badge{font-weight:700;padding:3px 10px;border-radius:20px;font-size:11px;letter-spacing:.3px}
  .badge.pos{background:var(--greenA);color:var(--green);border:1px solid rgba(63,185,80,.4)}
  .badge.neg{background:var(--redA);color:var(--red);border:1px solid rgba(248,81,73,.4)}
  .regime .txt{color:var(--mut)}
  .regime .txt b{color:var(--tx)}
  .wrap{padding:14px 16px}
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
  .clhead{display:flex;align-items:center;gap:16px;padding:9px 14px;border-bottom:1px solid var(--bd2);font-size:11.5px;color:var(--mut);flex-wrap:wrap}
  .lg{display:inline-flex;align-items:center;gap:6px}
  .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
  canvas{display:block;width:100%}
  #tip{position:fixed;display:none;pointer-events:none;z-index:60;background:#0d1117;border:1px solid var(--bd);
    border-radius:8px;padding:8px 12px;box-shadow:0 6px 20px rgba(0,0,0,.55)}
  #tip .k{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.3px}
  #tip .r{font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums;color:var(--mut)}
  .scrub{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--bd);background:var(--bd2)}
  .play{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--bd2);color:var(--tx);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .play:hover{background:var(--blue);border-color:var(--blue);color:#fff}
  input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:4px;background:var(--bd);flex:1;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--spot);border:2px solid #1a1f27;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--spot);border:2px solid #1a1f27;cursor:pointer}
  .tlab{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;min-width:74px;text-align:center}
  .tlab small{display:block;font-size:9px;color:var(--mut);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
  .speed{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
  .speed button{background:none;border:0;color:var(--mut);font:inherit;padding:4px 8px;cursor:pointer;font-size:11px}
  .speed button.on{background:var(--bd2);color:var(--tx)}
  .live{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:6px;padding:4px 9px;cursor:pointer;color:var(--mut);font-weight:600;font-size:11px}
  .live.on{color:var(--green);border-color:rgba(63,185,80,.4)}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .live.on .dot{background:var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .note{color:var(--dim);font-size:11px;padding:12px 16px 22px;line-height:1.6}
  .empty{padding:60px 16px;text-align:center;color:var(--mut)}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(3,1fr)}}
  /* 9:16 / narrow-width (mobile demos): header + scrub wrap, KPIs 2-col, no h-overflow */
  @media(max-width:520px){
    .top{padding:9px 11px;gap:8px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi{padding:8px 11px}.kpi .val{font-size:16px}
    .wrap{padding:10px 11px}
    .scrub{gap:9px;padding:9px 11px}.tlab{min-width:60px;font-size:13px}
    .regime{padding:8px 11px;flex-wrap:wrap}
    .note{padding:10px 11px 18px}
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand"><b>📊 GEX Profile</b><span id="subttl">gamma exposure · live chain</span></div>
  <div class="sp"></div>
  <div class="seg" id="vSeg"><button data-v="profile" class="on">Profile</button><button data-v="line">Line</button><button data-v="gext">⏱ Net&nbsp;GEX</button><button data-v="engine">Trade Engine</button></div>
  <div class="seg" id="smSeg" title="Level smoothing — Raw = live (jumpy), Smooth = 15-min median + confirm, Calm = 30-min. Levels: γ-flip / walls / max-pain / ±1σ."><button data-sm="off">Raw</button><button data-sm="med" class="on">Smooth</button><button data-sm="high">Calm</button></div>
  <div class="seg" id="uSeg"><button data-u="NIFTY" class="on">NIFTY</button><button data-u="BANKNIFTY">BANKNIFTY</button></div>
  <select class="ctl" id="uStock" title="RSI-strategy stocks (option chain collected live)"><option value="">Stocks ▾</option><option>RELIANCE</option><option>HDFCBANK</option><option>ICICIBANK</option><option>SBIN</option><option>INFY</option></select>
  <input type="date" class="ctl" id="datePick">
  <label class="ctl"><small>Expiry</small><select id="expSel" style="background:none;border:0;color:var(--tx);font:inherit;outline:none"></select></label>
  <div class="live" id="liveBtn"><span class="dot"></span><span id="liveTxt">Live: off</span></div>
  <span class="ctl" id="lastUpd" title="Last option-chain snapshot time">—</span>
  <button class="ctl" id="revealBtn" title="Reveal-as-you-play: hide everything ahead of the playhead (real playback feel — no peeking at the future)" style="display:none">▶ Reveal</button>
  <button class="ctl on" id="gexBtn" title="Per-strike GEX bars on the price axis (green = call wall, red = put wall)" style="display:none">▮ GEX</button>
  <span class="ctl" id="zoomHint" title="Trade Engine chart" style="display:none;color:var(--dim)">scroll = zoom · drag = pan</span>
  <a class="ctl" href="/whatif" title="Manual options what-if backtest">🧪 What-If</a>
  <a class="ctl" href="/curves" title="Sensibull-style curves">📈 Curves</a>
  <a class="ctl" href="/" title="Back to dashboard">← Dashboard</a>
</div>

<div class="kpis">
  <div class="kpi"><div class="lab">Spot</div><div class="val num" id="kSpot">—</div></div>
  <div class="kpi"><div class="lab" id="lab2">Net GEX</div><div class="val num" id="k2">—</div></div>
  <div class="kpi"><div class="lab">Regime</div><div class="val" id="kReg" style="font-size:14px">—</div></div>
  <div class="kpi"><div class="lab" id="lab4">Abs GEX (wall)</div><div class="val num" id="k4">—</div></div>
  <div class="kpi"><div class="lab">Max Pain</div><div class="val num" id="kMp">—</div></div>
  <div class="kpi"><div class="lab" id="lab6">PCR (OI)</div><div class="val num" id="k6">—</div></div>
  <div class="kpi"><div class="lab" id="lab7">India VIX</div><div class="val num" id="k7">—</div></div>
</div>

<div class="regime">
  <span class="badge" id="rBadge">—</span>
  <span class="txt" id="rTxt"></span>
</div>

<div class="wrap">
  <div class="card">
    <div class="scrub" id="scrubRow">
      <button class="play" id="play">▶</button>
      <div class="tlab"><span id="tNow">—</span><small id="tDate">IST</small></div>
      <input type="range" id="rng" min="0" max="0" value="0" step="1">
      <div class="speed"><button data-s="1">1×</button><button data-s="2" class="on">2×</button><button data-s="4">4×</button></div>
    </div>
    <div class="clhead" id="legend"></div>
    <canvas id="cv" height="440"></canvas>
    <div class="empty" id="empty" style="display:none">No option-chain snapshots for this day / expiry yet.</div>
  </div>
  <div class="note" id="chartNote"></div>
</div>
<div id="tip"></div>

<script>
const $ = id => document.getElementById(id);
let S = [], cur = 0, spd = 2, timer = null, liveTimer = null;
let gMax = 1, vMax = 1;                       // fixed scales across the loaded day
let U = 'NIFTY', DATE = '', EXP = '';
let VIEW = localStorage.getItem('gex_view') || 'profile';   // 'profile' | 'engine'
let SMOOTH = localStorage.getItem('gex_smooth') || 'med';   // 'off' | 'med' | 'high' — level smoothing
let GEXBARS = localStorage.getItem('gex_bars') !== '0';     // engine view: per-strike GEX histogram on the price axis (default on)
let REVEAL = localStorage.getItem('gex_reveal') === '1';    // time views: hide everything ahead of the playhead (real-playback feel; default off)
let SRC = 'collector';   // 'collector' (recent, real gamma-GEX) | 'lake' (historical, real OI)
let _candles = [], eT0 = 0, eT1 = 1, ePMin = 0, ePMax = 1;  // engine: candles + axis ranges
let _eBaseMin = 0, _eBaseMax = 1, _eZoom = {f:1, c:null};   // engine price-axis zoom (wheel/drag)

function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
const CR = 1e7;
function fmtCr(v){const c=v/CR,a=Math.abs(c);return (c<0?'-':'')+'₹'+(a>=1000?(a/1000).toFixed(2)+'k':Math.round(a))+' Cr';}
function fmtCount(v){if(v>=1e7)return (v/1e7).toFixed(2)+' Cr';if(v>=1e5)return (v/1e5).toFixed(1)+' L';if(v>=1e3)return (v/1e3).toFixed(0)+'K';return ''+Math.round(v);}

const cv = $('cv'), ctx = cv.getContext('2d');
function chartH(){ return VIEW==='engine' ? 560 : 440; }   // engine gets more vertical room
function size(){
  const w = cv.clientWidth, h = chartH(), dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width = w*dpr; cv.height = h*dpr; cv.style.height = h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
}
let _pLay = null;   // profile view layout {mL, slot, n} for hover mapping

function computeScales(){
  gMax = 1; vMax = 1;
  for(const s of S){ for(const st of s.strikes){
    gMax = Math.max(gMax, Math.abs(st.gex)); vMax = Math.max(vMax, st.vce, st.vpe);
  }}
}

// Trim the flat far-OTM strikes (tiny GEX) so the meaningful bars near spot are bigger.
// Window = the index range that holds any strike with |GEX| >= 2% of the day's max,
// plus the strike nearest each snapshot's spot, padded 1 each side. Stable across scrub.
let _strikeWin = null;   // {lo, hi} into s.strikes, or null = show all
function computeStrikeWindow(){
  _strikeWin = null;
  if(!S.length || !S[0] || !S[0].strikes || !S[0].strikes.length) return;
  const N = S[0].strikes.length, gm = Math.max(gMax, 1), thr = 0.02;
  let lo = N, hi = -1;
  for(const s of S){ for(let i=0;i<s.strikes.length;i++){ if(Math.abs(s.strikes[i].gex)/gm >= thr){ if(i<lo)lo=i; if(i>hi)hi=i; } } }
  if(hi < lo) return;                              // nothing significant → keep all
  for(const s of S){ let bi=0,bd=Infinity; for(let i=0;i<s.strikes.length;i++){ const dd=Math.abs(s.strikes[i].k - s.spot); if(dd<bd){bd=dd;bi=i;} } if(bi<lo)lo=bi; if(bi>hi)hi=bi; }
  lo = Math.max(0, lo-1); hi = Math.min(N-1, hi+1);
  if(hi-lo+1 < N) _strikeWin = {lo, hi};          // only when it actually trims
}
function _visStrikes(s){ return _strikeWin ? s.strikes.slice(_strikeWin.lo, _strikeWin.hi+1) : s.strikes; }

function draw(i){ return VIEW==='engine' ? drawEngine(i) : VIEW==='gext' ? drawGext(i) : VIEW==='line' ? drawLine(i) : drawProfile(i); }

// ---- engine view: candles (from per-minute spot) + moving GEX levels ----
function _mins(dt){ return (+dt.slice(11,13))*60 + (+dt.slice(14,16)); }
function computeEngine(){
  // 5-min OHLC from each snapshot's spot; axis ranges span candles + all levels for the day
  const buck = {};
  for(const s of S){ const b = Math.floor(_mins(s.dt)/5)*5; (buck[b]=buck[b]||[]).push(s.spot); }
  _candles = Object.keys(buck).map(b=>+b).sort((a,z)=>a-z).map(b=>{
    const a=buck[b]; return {t:b, o:a[0], h:Math.max(...a), l:Math.min(...a), c:a[a.length-1]};
  });
  eT0 = _mins(S[0].dt); eT1 = _mins(S[S.length-1].dt);
  // Y-range is driven by the CANDLES (price action stays big); levels extend the axis
  // only up to ~1.3x the candle range on each side — anything further (a wide EM band /
  // far wall) clamps to the chart edge instead of squashing the candles into a strip.
  let cLo=1e9, cHi=-1e9;
  for(const c of _candles){ cLo=Math.min(cLo,c.l); cHi=Math.max(cHi,c.h); }
  const cR = (cHi-cLo) || 20;
  // range = candles + the key walls/pins (flip/mp/cw/pw), capped ~1.2x candle range each side.
  // The ±1σ EM band is the WIDEST level and would squash the candles — it's excluded here and
  // just clamps to the chart edge when it falls outside (its label still shows the real price).
  let lLo=cLo, lHi=cHi;
  for(const s of S){ for(const k of ['flip','mp','cw','pw']){ const v=s[k]; if(v!=null){ lLo=Math.min(lLo,v); lHi=Math.max(lHi,v); } } }
  const lo = Math.max(lLo, cLo - cR*0.7), hi = Math.min(lHi, cHi + cR*0.7);
  const pad = cR*0.10;
  ePMin = lo - pad; ePMax = hi + pad;
  _eBaseMin = ePMin; _eBaseMax = ePMax;   // zoom baseline (wheel/drag zoom around this)
}
function drawEngine(i){
  const s = S[i]; if(!s || !_candles.length) return;
  const W = cv.clientWidth, H = chartH();
  const mL=8,mR=80,mT=14,mB=30, pw=W-mL-mR, ph=H-mT-mB;
  ctx.clearRect(0,0,W,H);
  // price-axis zoom/pan: wheel = zoom toward cursor, drag = pan, dbl-click = reset.
  // The horizontal levels below are drawn at py(price), so they stay pinned to their
  // own price as you zoom — only the candles/price scale change ("lines apni jagah fix").
  { const br=(_eBaseMax-_eBaseMin)||20, cen=(_eZoom.c==null?(_eBaseMin+_eBaseMax)/2:_eZoom.c), half=br/2/(_eZoom.f||1);
    ePMin=cen-half; ePMax=cen+half; }
  const tx = t => mL + (t-eT0)/(eT1-eT0||1)*pw;
  const py = p => mT + (ePMax-p)/(ePMax-ePMin||1)*ph;
  const clampY = y => Math.max(mT+8, Math.min(mT+ph-8, y));
  const nowT = _mins(s.dt);
  // ±1σ EM band at current snapshot (clamped to the plot area)
  if(s.emh!=null && s.eml!=null){ const yt=Math.max(mT,py(s.emh)), yb=Math.min(mT+ph,py(s.eml));
    ctx.fillStyle='rgba(210,153,34,.10)'; ctx.fillRect(mL, yt, pw, Math.max(0,yb-yt)); }
  // grid + price labels
  const step = Math.max(10, Math.round((ePMax-ePMin)/6/10)*10);
  ctx.font='10px sans-serif';
  for(let p=Math.ceil(ePMin/step)*step; p<ePMax; p+=step){ const y=py(p);
    ctx.strokeStyle=css('--bd2'); ctx.globalAlpha=.5; ctx.beginPath();ctx.moveTo(mL,y);ctx.lineTo(mL+pw,y);ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle=css('--dim'); ctx.textAlign='left'; ctx.fillText(p.toFixed(0), mL+pw+42, y+3); }
  // time axis (hourly)
  ctx.fillStyle=css('--dim'); ctx.textAlign='center';
  for(let t=Math.ceil(eT0/60)*60; t<=eT1; t+=60){ ctx.fillText(String(t/60|0).padStart(2,'0')+':00', tx(t), H-10); }
  // candles: solid up to playhead, faded ahead. Clipped to the plot area so a zoomed-in
  // price scale can't paint candles over the axis labels / time row.
  ctx.save(); ctx.beginPath(); ctx.rect(mL, mT, pw, ph); ctx.clip();
  const bw = Math.max(3, pw/_candles.length*0.72);
  for(const c of _candles){ if(REVEAL && c.t>nowT) continue;   // reveal: future candles hidden, not faded
    const x=tx(c.t+2.5), up=c.c>=c.o;
    ctx.globalAlpha = c.t>nowT ? 0.26 : 1;
    ctx.strokeStyle=ctx.fillStyle = up?css('--green'):css('--red');
    ctx.beginPath();ctx.moveTo(x,py(c.h));ctx.lineTo(x,py(c.l));ctx.stroke();
    const yo=py(c.o),yc=py(c.c); ctx.fillRect(x-bw/2, Math.min(yo,yc), bw, Math.max(1.5,Math.abs(yc-yo)));
    ctx.globalAlpha=1;
  }
  ctx.restore();
  // GEX-by-strike histogram pinned to the right price axis (Profile bars rotated 90°):
  // each strike's Net GEX bar sits at its own price level, anchored to the right edge and
  // extending LEFT, translucent so candles show through. Green = positive GEX (call wall /
  // resistance), red = negative (put wall / support). Follows the current smoothing (bars are
  // the same EMA'd strikes). Pinned to price → stays put as you zoom/scrub, like the levels.
  if(GEXBARS && s.strikes && s.strikes.length){
    const xR = mL+pw, maxLen = pw*0.24, gm = Math.max(gMax,1);
    const stepK = (s.strikes.length>1 ? Math.abs(s.strikes[1].k - s.strikes[0].k) : 50) || 50;
    const th = Math.max(4, Math.min(15, Math.abs(py(0)-py(stepK))*0.66));   // bar thickness from strike spacing in px
    ctx.save(); ctx.beginPath(); ctx.rect(mL,mT,pw,ph); ctx.clip();
    for(const st of s.strikes){
      const y = py(st.k); if(y < mT-2 || y > mT+ph+2) continue;
      const len = Math.abs(st.gex)/gm*maxLen; if(len < 0.6) continue;
      const posv = st.gex>=0, col = posv?css('--green'):css('--red');
      ctx.fillStyle=col; ctx.globalAlpha=.40; ctx.fillRect(xR-len, y-th/2, len, th);
      ctx.globalAlpha=.85; ctx.strokeStyle=col; ctx.lineWidth=1; ctx.strokeRect(xR-len+.5, y-th/2+.5, Math.max(0,len-1), th-1);
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }
  // horizontal levels at current snapshot
  // levels: draw each line at its true price, then de-overlap the right-edge LABELS so
  // coinciding levels (e.g. put wall == γ-flip at the same strike) both stay readable.
  const lvls = [
    {p:s.emh, c:css('--amber'),  t:'+1σ '+(s.emh!=null?s.emh.toFixed(0):''), d:1},
    {p:s.eml, c:css('--amber'),  t:'-1σ '+(s.eml!=null?s.eml.toFixed(0):''), d:1},
    {p:s.cw,  c:css('--green'),  t:'Call '+s.cw, d:0},
    {p:s.pw,  c:css('--red'),    t:'Put '+s.pw, d:0},
    {p:s.mp,  c:css('--purple'), t:'MP '+s.mp, d:1},
    {p:s.flip,c:css('--blue'),   t:'γ '+s.flip, d:1},
  ].filter(l=>l.p!=null);
  for(const l of lvls){ const y=clampY(py(l.p)); l.y=y; l.ly=y;
    ctx.strokeStyle=l.c; ctx.lineWidth=1.5; ctx.setLineDash(l.d?[5,4]:[]);
    ctx.beginPath();ctx.moveTo(mL,y);ctx.lineTo(mL+pw,y);ctx.stroke(); ctx.setLineDash([]); }
  // push labels apart (14px boxes → ≥15px gap), then lift the group up if it runs past the bottom
  const bySort=[...lvls].sort((a,b)=>a.y-b.y);
  for(let j=1;j<bySort.length;j++){ if(bySort[j].ly - bySort[j-1].ly < 15) bySort[j].ly = bySort[j-1].ly + 15; }
  const bottom=mT+ph-8;
  for(let j=bySort.length-1;j>0;j--){ if(bySort[j].ly > bottom){ bySort[j].ly = bottom; if(bySort[j-1].ly > bySort[j].ly-15) bySort[j-1].ly = bySort[j].ly-15; } }
  for(const l of lvls){
    if(Math.abs(l.ly-l.y)>1){ ctx.strokeStyle=l.c; ctx.lineWidth=1; ctx.beginPath();ctx.moveTo(mL+pw,l.y);ctx.lineTo(mL+pw+2,l.ly);ctx.stroke(); }
    ctx.fillStyle=l.c; ctx.fillRect(mL+pw+2, l.ly-7, mR-4, 14);
    ctx.fillStyle='#0d1117'; ctx.font='bold 10px sans-serif'; ctx.textAlign='left'; ctx.fillText(l.t, mL+pw+5, l.ly+3);
  }
  // playhead + spot dot + tag
  const xN=tx(nowT), yS=py(s.spot);
  ctx.strokeStyle=css('--spot'); ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(xN,mT);ctx.lineTo(xN,mT+ph);ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=css('--spot'); ctx.beginPath();ctx.arc(xN,yS,4,0,7);ctx.fill();
  ctx.fillRect(mL+pw+2, yS-8, mR-4, 16); ctx.fillStyle='#0d1117'; ctx.font='bold 11px sans-serif'; ctx.textAlign='left'; ctx.fillText(s.spot.toFixed(0), mL+pw+5, yS+3);
}

function drawProfile(i){
  const s = S[i]; if(!s) return;
  const W = cv.clientWidth, H = chartH();
  const mL=64,mR=58,mT=20,mB=42, pw=W-mL-mR, ph=H-mT-mB;
  const zeroY = mT+ph*0.46;
  ctx.clearRect(0,0,W,H);
  const strikes = _visStrikes(s);
  const ks = strikes.map(d=>d.k), n = ks.length, slot = pw/n;
  _pLay = {mL, slot, n, lo: _strikeWin?_strikeWin.lo:0};   // for hover tooltip mapping
  const xOf = idx => mL + slot*(idx+0.5);
  const lo = ks[0], hi = ks[n-1];
  const xk = k => mL + ((k-lo)/(hi-lo||1))*(pw-slot) + slot/2;

  const vBot = mT+ph, vTop = mT+6, vh = vBot-vTop;
  function area(key, fill, stroke){
    ctx.beginPath();
    strikes.forEach((d,idx)=>{const x=xOf(idx),y=vBot-(d[key]/vMax)*vh; idx?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.lineTo(xOf(n-1),vBot); ctx.lineTo(xOf(0),vBot); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
    ctx.beginPath();
    strikes.forEach((d,idx)=>{const x=xOf(idx),y=vBot-(d[key]/vMax)*vh; idx?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.globalAlpha=.5; ctx.stroke(); ctx.globalAlpha=1;
  }
  area('vpe', css('--putA'), css('--spot'));
  area('vce', css('--callA'), '#58a6ff');

  const gUp = zeroY-mT-4, gDn = (mT+ph)-zeroY-4, bw = Math.min(slot*0.56,26);
  strikes.forEach((d,idx)=>{
    const x=xOf(idx), up=d.gex>=0, h=Math.abs(d.gex)/gMax*(up?gUp:gDn);
    ctx.fillStyle = up?css('--green'):css('--red');
    ctx.fillRect(x-bw/2, up?zeroY-h:zeroY, bw, h);
  });
  ctx.strokeStyle=css('--bd'); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(mL,zeroY); ctx.lineTo(mL+pw,zeroY); ctx.stroke();

  ctx.fillStyle=css('--mut'); ctx.font='10px -apple-system,sans-serif'; ctx.textAlign='center';
  strikes.forEach((d,idx)=>{ if(idx%2)return; ctx.fillText(d.k, xOf(idx), H-14); });
  ctx.save(); ctx.translate(15,mT+ph/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle=css('--dim'); ctx.font='10px sans-serif'; ctx.textAlign='center';
  ctx.fillText(SRC==='lake'?'◄ PUT OI   ·   NET OI   ·   CALL OI ►':'◄ PUT GEX   ·   GEX   ·   CALL GEX ►',0,0); ctx.restore();

  function vline(k, color, label, top){
    if(k==null) return;
    const x = xk(k);
    ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(x,mT-2); ctx.lineTo(x,mT+ph); ctx.stroke(); ctx.setLineDash([]);
    ctx.font='bold 11px sans-serif';
    const tw = ctx.measureText(label).width+12;
    const ly = top?mT+9:mT+ph-8, tx = Math.min(Math.max(x,mL+tw/2),mL+pw-tw/2);
    ctx.fillStyle=color; ctx.fillRect(tx-tw/2,ly-11,tw,16);
    ctx.fillStyle='#0d1117'; ctx.textAlign='center'; ctx.fillText(label,tx,ly+1);
  }
  vline(s.flip, css('--blue'), (SRC==='lake'?'OI-flip ':'γ ')+(s.flip!=null?s.flip:''), false);
  vline(s.mp, css('--purple'), 'Max Pain '+s.mp, false);
  vline(s.spot, css('--spot'), 'SPOT '+s.spot.toFixed(0), true);

  ctx.fillStyle=css('--dim'); ctx.font='9px sans-serif'; ctx.textAlign='left';
  ctx.fillText((vMax/1e7).toFixed(1)+'Cr vol', mL+pw+6, vTop+6);
}

// ---- line view: Net GEX per strike as a CURVE (sign-split area + line) ----
function drawLine(i){
  const s = S[i]; if(!s) return;
  const W = cv.clientWidth, H = chartH();
  const mL=64,mR=58,mT=20,mB=42, pw=W-mL-mR, ph=H-mT-mB;
  const zeroY = mT+ph*0.5;
  ctx.clearRect(0,0,W,H);
  const strikes = _visStrikes(s);
  const ks = strikes.map(d=>d.k), n = ks.length, slot = pw/n;
  _pLay = {mL, slot, n, lo: _strikeWin?_strikeWin.lo:0};                                  // hover tooltip mapping (same as bars)
  const xOf = idx => mL + slot*(idx+0.5);
  const lo = ks[0], hi = ks[n-1];
  const xk = k => mL + ((k-lo)/(hi-lo||1))*(pw-slot) + slot/2;
  const gUp = zeroY-mT-6, gDn = (mT+ph)-zeroY-6;
  const gy = g => zeroY - (g>=0 ? (g/gMax)*gUp : (g/gMax)*gDn);   // GEX → y

  function curveToZero(){                                 // closed path: curve + back along zero line
    ctx.beginPath();
    strikes.forEach((d,idx)=>{ const x=xOf(idx), y=gy(d.gex); idx?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.lineTo(xOf(n-1),zeroY); ctx.lineTo(xOf(0),zeroY); ctx.closePath();
  }
  // green fill above zero (call-heavy), red fill below (put-heavy) — clip by side
  ctx.save(); ctx.beginPath(); ctx.rect(mL,mT,pw,zeroY-mT); ctx.clip();
  curveToZero(); ctx.fillStyle='rgba(63,185,80,.22)'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(mL,zeroY,pw,(mT+ph)-zeroY); ctx.clip();
  curveToZero(); ctx.fillStyle='rgba(248,81,73,.22)'; ctx.fill(); ctx.restore();
  // zero line
  ctx.strokeStyle=css('--bd'); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(mL,zeroY); ctx.lineTo(mL+pw,zeroY); ctx.stroke();
  // the GEX curve
  ctx.beginPath();
  strikes.forEach((d,idx)=>{ const x=xOf(idx), y=gy(d.gex); idx?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.strokeStyle=css('--purple'); ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();
  // dot per strike (colour by sign)
  strikes.forEach((d,idx)=>{ const x=xOf(idx), y=gy(d.gex);
    ctx.fillStyle = d.gex>=0?css('--green'):css('--red');
    ctx.beginPath(); ctx.arc(x,y,2,0,7); ctx.fill(); });
  // strike labels + axis label
  ctx.fillStyle=css('--mut'); ctx.font='10px -apple-system,sans-serif'; ctx.textAlign='center';
  strikes.forEach((d,idx)=>{ if(idx%2)return; ctx.fillText(d.k, xOf(idx), H-14); });
  ctx.save(); ctx.translate(15,mT+ph/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle=css('--dim'); ctx.font='10px sans-serif'; ctx.textAlign='center';
  ctx.fillText(SRC==='lake'?'◄ PUT OI   ·   NET OI   ·   CALL OI ►':'◄ PUT GEX   ·   NET GEX   ·   CALL GEX ►',0,0); ctx.restore();
  // spot / max-pain / γ-flip vertical lines (same as bars)
  function vline(k, color, label, top){
    if(k==null) return;
    const x = xk(k);
    ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(x,mT-2); ctx.lineTo(x,mT+ph); ctx.stroke(); ctx.setLineDash([]);
    ctx.font='bold 11px sans-serif';
    const tw = ctx.measureText(label).width+12;
    const ly = top?mT+9:mT+ph-8, tx = Math.min(Math.max(x,mL+tw/2),mL+pw-tw/2);
    ctx.fillStyle=color; ctx.fillRect(tx-tw/2,ly-11,tw,16);
    ctx.fillStyle='#0d1117'; ctx.textAlign='center'; ctx.fillText(label,tx,ly+1);
  }
  vline(s.flip, css('--blue'), (SRC==='lake'?'OI-flip ':'γ ')+(s.flip!=null?s.flip:''), false);
  vline(s.mp, css('--purple'), 'Max Pain '+s.mp, false);
  vline(s.spot, css('--spot'), 'SPOT '+s.spot.toFixed(0), true);
}

// ---- ⏱ Net-GEX-over-time view: aggregate net GEX as a time-series line (+ spot overlay) ----
// x = intraday time (real minutes), y-left = net GEX (Cr) with a 0 baseline (green area above /
// red below), y-right = spot (faint orange) so the GEX shape can be eyeballed against price.
// Playhead + dot mark the current scrub minute. Follows smoothing (net is the smoothed value).
function drawGext(i){
  const s = S[i]; if(!s || !S.length) return;
  const W = cv.clientWidth, H = chartH();
  const mL=66,mR=58,mT=18,mB=42, pw=W-mL-mR, ph=H-mT-mB;
  ctx.clearRect(0,0,W,H);
  const oi = SRC==='lake';
  const fmtNet = oi ? (v=>(v>=0?'+':'−')+fmtCount(Math.abs(v))) : fmtCr;
  const t0=_mins(S[0].dt), t1=_mins(S[S.length-1].dt);
  const tx = t => mL + (t-t0)/((t1-t0)||1)*pw;
  // reveal mode: only draw up to the playhead (future hidden). Axis ranges still use the FULL
  // day so the scale never jumps as you play — only the drawn portion grows.
  const VIS = REVEAL ? S.slice(0, i+1) : S, tEnd = _mins(VIS[VIS.length-1].dt);
  let nLo=0,nHi=0, spLo=1e9,spHi=-1e9;
  for(const x of S){ nLo=Math.min(nLo,x.net); nHi=Math.max(nHi,x.net); spLo=Math.min(spLo,x.spot); spHi=Math.max(spHi,x.spot); }
  if(nHi===nLo) nHi=nLo+1;
  const nPad=(nHi-nLo)*0.08;
  const gy = v => mT + (nHi+nPad - v)/((nHi-nLo)+2*nPad)*ph;
  const zeroY = gy(0);
  const spPad=(spHi-spLo)*0.14||1;
  const spy = v => mT + (spHi+spPad - v)/((spHi-spLo)+2*spPad)*ph;

  // grid + left GEX axis labels
  ctx.font='10px sans-serif';
  for(let k=0;k<=4;k++){ const v=nLo+(nHi-nLo)*k/4, y=gy(v);
    ctx.strokeStyle=css('--bd2'); ctx.globalAlpha=.5; ctx.beginPath();ctx.moveTo(mL,y);ctx.lineTo(mL+pw,y);ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle=css('--dim'); ctx.textAlign='right'; ctx.fillText(fmtNet(v), mL-6, y+3); }
  // spot overlay (secondary, faint) — behind
  ctx.strokeStyle=css('--spot'); ctx.globalAlpha=.5; ctx.lineWidth=1.2;
  ctx.beginPath(); VIS.forEach((x,idx)=>{const X=tx(_mins(x.dt)),Y=spy(x.spot); idx?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}); ctx.stroke(); ctx.globalAlpha=1;
  ctx.fillStyle=css('--spot'); ctx.textAlign='left'; ctx.globalAlpha=.8;
  ctx.fillText(spHi.toFixed(0), mL+pw+6, spy(spHi)+3); ctx.fillText(spLo.toFixed(0), mL+pw+6, spy(spLo)+3); ctx.globalAlpha=1;
  // net GEX area: green above zero, red below (clip by side)
  function areaToZero(){ ctx.beginPath();
    VIS.forEach((x,idx)=>{const X=tx(_mins(x.dt)),Y=gy(x.net); idx?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
    ctx.lineTo(tx(tEnd),zeroY); ctx.lineTo(tx(t0),zeroY); ctx.closePath(); }
  ctx.save(); ctx.beginPath(); ctx.rect(mL,mT,pw,zeroY-mT); ctx.clip(); areaToZero(); ctx.fillStyle='rgba(63,185,80,.18)'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(mL,zeroY,pw,(mT+ph)-zeroY); ctx.clip(); areaToZero(); ctx.fillStyle='rgba(248,81,73,.18)'; ctx.fill(); ctx.restore();
  // zero baseline
  ctx.strokeStyle=css('--bd'); ctx.lineWidth=1; ctx.beginPath();ctx.moveTo(mL,zeroY);ctx.lineTo(mL+pw,zeroY);ctx.stroke();
  // the net GEX line
  ctx.beginPath(); VIS.forEach((x,idx)=>{const X=tx(_mins(x.dt)),Y=gy(x.net); idx?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
  ctx.strokeStyle=css('--tx'); ctx.lineWidth=1.8; ctx.lineJoin='round'; ctx.stroke();
  // axis titles
  ctx.save(); ctx.translate(15,mT+ph/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle=css('--dim'); ctx.textAlign='center'; ctx.fillText(oi?'NET OI':'NET GEX (Cr)',0,0); ctx.restore();
  // time axis (hourly)
  ctx.fillStyle=css('--dim'); ctx.textAlign='center';
  for(let t=Math.ceil(t0/60)*60;t<=t1;t+=60){ ctx.fillText(String(t/60|0).padStart(2,'0')+':00', tx(t), H-14); }
  // playhead + dots + current value tag
  const xN=tx(_mins(s.dt)), yN=gy(s.net);
  ctx.strokeStyle=css('--spot'); ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.beginPath();ctx.moveTo(xN,mT);ctx.lineTo(xN,mT+ph);ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=css('--spot'); ctx.beginPath();ctx.arc(xN,spy(s.spot),3,0,7);ctx.fill();
  ctx.fillStyle= s.net>=0?css('--green'):css('--red'); ctx.beginPath();ctx.arc(xN,yN,4,0,7);ctx.fill();
  ctx.font='bold 11px sans-serif'; const tag=fmtNet(s.net), tw=ctx.measureText(tag).width+10;
  const tgx=Math.min(xN+7, mL+pw-tw), tgy=Math.max(mT+13, yN-8);
  ctx.fillStyle= s.net>=0?css('--green'):css('--red'); ctx.fillRect(tgx, tgy-12, tw, 15);
  ctx.fillStyle='#0d1117'; ctx.textAlign='left'; ctx.fillText(tag, tgx+5, tgy);
}

function kpi(i){
  const s = S[i]; if(!s) return;
  const pos = s.net>=0, oi = SRC==='lake';
  $('kSpot').textContent = s.spot.toFixed(2);
  $('kMp').textContent = s.mp;
  $('kReg').innerHTML = oi
    ? (pos ? '<span style="color:var(--green)">Call-heavy</span>' : '<span style="color:var(--red)">Put-heavy</span>')
    : (pos ? '<span style="color:var(--green)">Positive γ</span>' : '<span style="color:var(--red)">Negative γ</span>');
  if(VIEW==='engine'){
    $('k2').textContent = s.flip==null?'—':s.flip;
    $('k4').textContent = s.cw==null?'—':s.cw;
    $('k6').textContent = s.pw==null?'—':s.pw;

  } else {
    const n=$('k2'); n.innerHTML = oi ? ((s.net>=0?'+':'−')+fmtCount(Math.abs(s.net))) : fmtCr(s.net);
    n.style.color=pos?'var(--green)':'var(--red)';
    $('k4').textContent = s.ag;
    $('k6').textContent = s.pcr==null?'—':s.pcr;
    $('k7').textContent = s.vix==null?'—':s.vix;
  }
  const b = $('rBadge'), t = $('rTxt');
  if(oi){ b.className='badge '+(pos?'pos':'neg'); b.textContent=pos?'CALL-HEAVY OI':'PUT-HEAVY OI';
    t.innerHTML='Historical · real OI. Put wall (support) <b>'+(s.pw??'')+'</b> · call wall (resistance) <b>'+(s.cw??'')+'</b> · max-pain pin <b>'+s.mp+'</b>. Lake me gamma/IV nahi → OI map, GEX nahi.'; }
  else if(pos){ b.className='badge pos'; b.textContent='POSITIVE GAMMA';

  else{ b.className='badge neg'; b.textContent='NEGATIVE GAMMA';
    t.innerHTML='Moves amplify, trend-friendly. A break past the <b>'+(s.flip!=null?s.flip:s.ag)+'</b> γ-flip can accelerate — walls <b>'+(s.pw??'')+'</b>/<b>'+(s.cw??'')+'</b> are the rails.'; }
  $('tNow').textContent = s.dt.slice(11,16);
}

    +'<span class="lg"><i class="sw" style="background:var(--purple)"></i> Max Pain (pin)</span>'
    +'<span class="lg"><i class="sw" style="background:var(--green)"></i> Call wall (resistance)</span>'
    +'<span class="lg"><i class="sw" style="background:var(--red)"></i> Put wall (support)</span>'
    +'<span class="lg" style="margin-left:auto;color:var(--amber)">⚠ Historical: real OI, no ±1σ EM (no IV)</span>',
  gext: '<span class="lg"><i class="sw" style="background:var(--tx)"></i> Net OI over the day</span>'
    +'<span class="lg"><i class="sw" style="background:var(--green)"></i> Call-heavy</span>'
    +'<span class="lg"><i class="sw" style="background:var(--red)"></i> Put-heavy</span>'
    +'<span class="lg"><i class="sw" style="background:var(--spot);width:3px"></i> Spot (right)</span>'
    +'<span class="lg" style="margin-left:auto;color:var(--amber)">⚠ Historical: real OI</span>'
};
const _NOTE_OI = {
  profile: 'Historical date — expired-options lake (real OI + volume, ~2021→). Bars = <b>Net OI</b> (OI<sub>CE</sub> − OI<sub>PE</sub>): green = call-heavy (resistance), red = put-heavy (support). Walls / max-pain / PCR are the REAL OI ones. Lake me greeks/IV nahi → OI map hai, gamma-GEX nahi; ±1σ EM unavailable. <b>Kuch derive nahi kiya.</b>',
  line: 'Historical — <b>Net OI</b> per strike (OI<sub>CE</sub> − OI<sub>PE</sub>) drawn as a CURVE. Green above zero = call-heavy, red below = put-heavy; the shape shows where OI flips around spot/max-pain. Lake me gamma/IV nahi → OI map, GEX nahi.',
  engine: 'Historical date — real per-minute spot candles + real OI walls / max-pain / OI-flip (expired-options lake). Lake me gamma/IV nahi → OI-based (gamma-GEX nahi), ±1σ EM band off. Scrub / ▶ play: price vs OI walls dekho.',
  gext: 'Historical — aggregate <b>Net OI</b> (OI<sub>CE</sub> − OI<sub>PE</sub>, summed over strikes) across the day; green above 0 = call-heavy, red below = put-heavy. Faint orange = spot (right axis). Lake me gamma/IV nahi → OI-based (gamma-GEX nahi). Context map, not a signal.'
};
function applyView(){
  [...$('vSeg').children].forEach(x=>x.classList.toggle('on', x.dataset.v===VIEW));
  const eng = VIEW==='engine', oi = SRC==='lake';
  $('subttl').textContent = oi ? (U+' · OI PROFILE · historical (no gamma)') : (U+' · gamma exposure · live chain');
  $('lab2').textContent = eng?'γ-Flip':(oi?'Net OI':'Net GEX');
  $('lab4').textContent = eng?'Call wall ↑':(oi?'Abs OI (wall)':'Abs GEX (wall)');
  $('lab6').textContent = eng?'Put wall ↓':'PCR (OI)';
  $('lab7').textContent = eng?(oi?'±1σ EM (n/a)':'±1σ Exp. move'):'India VIX';
  $('k2').style.color = eng?'var(--blue)':'';
  $('k4').style.color = eng?'var(--green)':'';
  $('k6').style.color = eng?'var(--red)':'';
  $('k7').style.color = eng?'var(--amber)':'';
  if(eng) $('k7').style.fontSize='13px'; else $('k7').style.fontSize='';
  $('legend').innerHTML = oi ? _LEGEND_OI[VIEW] : _LEGEND[VIEW];
  $('chartNote').innerHTML = oi ? _NOTE_OI[VIEW] : _NOTE[VIEW];
  $('zoomHint').style.display = eng ? 'inline-flex' : 'none';   // zoom/pan only on the Engine candle chart
  $('gexBtn').style.display = eng ? 'inline-flex' : 'none';     // GEX-bars toggle only on the Engine chart
  $('gexBtn').classList.toggle('on', GEXBARS);
  $('revealBtn').style.display = (eng || VIEW==='gext') ? 'inline-flex' : 'none';   // playback-reveal on the time views
  $('revealBtn').classList.toggle('on', REVEAL);
  updZoomHint();
}

function show(i){ cur=i; kpi(i); $('rng').value=i; drawReady(i); }

// KPIs update immediately (above); the canvas draw waits for a real layout width
// (guards hidden/background-tab loads where clientWidth is 0 at first paint — resize
// alone doesn't always fire). Decoupled so the numbers never wait on the chart.
function drawReady(i){
  if(cv.clientWidth > 0){ size(); draw(i); return; }
  requestAnimationFrame(()=>drawReady(i));
}

$('rng').addEventListener('input', e => { stop(); show(+e.target.value); });
function step(){ cur=(cur+1)%S.length; show(cur); }
function start(){ $('play').textContent='⏸'; timer=setInterval(step, 320/spd); }
function stop(){ clearInterval(timer); timer=null; $('play').textContent='▶'; }
$('play').addEventListener('click', ()=> timer?stop():start());
document.querySelectorAll('.speed button').forEach(b=>b.addEventListener('click', ()=>{
  document.querySelectorAll('.speed button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); spd=+b.dataset.s; if(timer){stop();start();}
}));
window.addEventListener('resize', ()=>{ size(); draw(cur); });

// ---- profile-view hover: strike readout (big) ----
function fmtVol(v){ v=v||0; if(v>=1e7) return (v/1e7).toFixed(2)+' Cr'; if(v>=1e5) return (v/1e5).toFixed(1)+' L'; if(v>=1e3) return (v/1e3).toFixed(0)+'K'; return ''+Math.round(v); }
cv.addEventListener('mousemove', e=>{
  const tip=$('tip'), s=S[cur];
  if((VIEW!=='profile' && VIEW!=='line') || !s || !_pLay){ tip.style.display='none'; return; }
  const rect=cv.getBoundingClientRect(), x=e.clientX-rect.left;
  const idx=Math.round((x-_pLay.mL)/_pLay.slot - 0.5), st=s.strikes[idx + (_pLay.lo||0)];
  if(idx<0 || idx>=_pLay.n || !st){ tip.style.display='none'; return; }
  const gcr=st.gex/1e7, sign=gcr>=0?'+':'-', a=Math.abs(gcr);
  tip.innerHTML='<div class="k">'+st.k.toFixed(0)+'</div>'
    +'<div class="r" style="color:'+(gcr>=0?'var(--green)':'var(--red)')+'">Net GEX '+sign+'₹'+(a>=1000?(a/1000).toFixed(2)+'k':a.toFixed(0))+' Cr</div>'
    +'<div class="r">Call vol '+fmtVol(st.vce)+' · Put vol '+fmtVol(st.vpe)+'</div>';
  tip.style.display='block';
  let tx=e.clientX+16, ty=e.clientY+16;
  if(tx+tip.offsetWidth>window.innerWidth-8) tx=e.clientX-tip.offsetWidth-16;
  if(ty+tip.offsetHeight>window.innerHeight-8) ty=e.clientY-tip.offsetHeight-16;
  tip.style.left=tx+'px'; tip.style.top=ty+'px';
});
cv.addEventListener('mouseleave', ()=>{ $('tip').style.display='none'; });

// ---- engine-view price-axis zoom/pan (like a normal price chart; levels stay pinned) ----
cv.addEventListener('wheel', e=>{
  if(VIEW!=='engine' || !_candles.length) return;
  e.preventDefault();
  const rect=cv.getBoundingClientRect(), H=chartH(), mT=14, mB=30, ph=H-mT-mB;
  const fy=Math.max(0,Math.min(1,(e.clientY-rect.top-mT)/ph));   // 0=top,1=bottom
  const pAt=ePMax - fy*(ePMax-ePMin);                            // price under cursor NOW
  const nf=Math.max(1, Math.min(14, (_eZoom.f||1)*(e.deltaY<0?1.15:1/1.15)));
  const half=((_eBaseMax-_eBaseMin)||20)/2/nf, nMax=pAt + fy*(2*half);   // keep pAt under the cursor
  _eZoom.f=nf; _eZoom.c=nMax-half;
  draw(cur); updZoomHint();
}, {passive:false});
let _eDrag=null;
cv.addEventListener('mousedown', e=>{ if(VIEW==='engine'){ _eDrag={y:e.clientY, c:(_eZoom.c==null?(_eBaseMin+_eBaseMax)/2:_eZoom.c)}; cv.style.cursor='grabbing'; } });
window.addEventListener('mousemove', e=>{
  if(!_eDrag) return;
  const H=chartH(), mT=14, mB=30, ph=H-mT-mB, ppp=ph/((ePMax-ePMin)||1);
  _eZoom.c=_eDrag.c + (e.clientY-_eDrag.y)/ppp;   // grab-drag pans the price axis
  draw(cur);
});
window.addEventListener('mouseup', ()=>{ if(_eDrag){ _eDrag=null; cv.style.cursor=''; } });
cv.addEventListener('dblclick', ()=>{ if(VIEW==='engine'){ _eZoom={f:1,c:null}; draw(cur); updZoomHint(); } });
function updZoomHint(){ const el=$('zoomHint'); if(el) el.textContent = (_eZoom.f>1.02?('🔍 '+_eZoom.f.toFixed(1)+'× · dbl-click reset'):'scroll = zoom · drag = pan'); }

// ---- data ----
let _loadSeq = 0;
const _dayCache = {};   // "U|date|expiry" -> response (past days are immutable → re-switch is instant)
async function load(keepPos){
  const seq = ++_loadSeq;
  if(!keepPos) _eZoom = {f:1, c:null};   // fresh day/underlying/expiry → reset engine zoom
  const key = `${U}|${DATE}|${EXP||''}|${SMOOTH}`;
  let d;
  if(!keepPos && _dayCache[key]){
    d = _dayCache[key];                                  // cache hit → no fetch, instant switch
  } else {
    const url = `/api/gex?underlying=${U}&date=${DATE}&smooth=${SMOOTH}` + (EXP?`&expiry=${encodeURIComponent(EXP)}`:'');
    try{ d = await (await fetch(url)).json(); }catch(e){ d = {ok:false}; }
    if(seq !== _loadSeq) return;   // a newer load started while we awaited — drop this stale response
    if((d.snaps||[]).length){      // cache good days only (live-refresh keeps re-fetching fresh)
      _dayCache[key] = d;
      const ks = Object.keys(_dayCache); if(ks.length > 20) delete _dayCache[ks[0]];
    }
  }
  const snaps = d.snaps||[];
  // Refresh (live/expiry) that comes back empty/errored — a transient network hiccup on a
  // slow link — must NOT wipe a chart that's already showing good data. Only a FRESH
  // navigation (date/underlying change, keepPos=false) may legitimately show the empty state.
  if(!snaps.length && keepPos && S.length) return;
  // expiry dropdown
  const es = d.expiries||[]; const sel=$('expSel');
  if(es.join(',') !== [...sel.options].map(o=>o.value).join(',')){
    sel.innerHTML = es.map(e=>`<option value="${e}">${e}</option>`).join('');
  }
  if(d.expiry){ EXP=d.expiry; sel.value=d.expiry; }
  S = snaps;
  SRC = d.source || 'collector';
  if(!S.length){ $('empty').style.display='block'; $('scrubRow').style.display='none'; cv.style.display='none';
    $('kSpot').textContent='—'; return; }
  applyView();   // relabel bars/legend/subtitle for the source (gamma-GEX vs OI)
  $('empty').style.display='none'; $('scrubRow').style.display='flex'; cv.style.display='block';
  computeScales();
  computeStrikeWindow();
  computeEngine();
  $('rng').max = S.length-1;
  $('tDate').textContent = 'IST · '+(d.date||DATE).slice(5);
  const pos = keepPos ? Math.min(cur, S.length-1) : Math.floor(S.length*0.55);
  show(pos);
  updLastUpd();
}

// view toggle (Profile <-> Trade Engine) — shares the same data + scrubber
$('vSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b || b.dataset.v===VIEW) return;
  VIEW=b.dataset.v; localStorage.setItem('gex_view', VIEW);
  applyView(); if(S.length) show(cur);
});

// smoothing toggle (Raw / Smooth / Calm) — server-side; refetch same day, keep scrub position
[...$('smSeg').children].forEach(x=>x.classList.toggle('on', x.dataset.sm===SMOOTH));   // reflect persisted
$('smSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b || b.dataset.sm===SMOOTH) return;
  [...$('smSeg').children].forEach(x=>x.classList.toggle('on', x.dataset.sm===b.dataset.sm));
  SMOOTH=b.dataset.sm; localStorage.setItem('gex_smooth', SMOOTH);
  stop(); load(true);   // re-pull the day with new smoothing, keep scrub position
});

// GEX-bars toggle (engine view) — client-side only (uses already-loaded strikes), no refetch
$('gexBtn').addEventListener('click', ()=>{
  GEXBARS = !GEXBARS; localStorage.setItem('gex_bars', GEXBARS?'1':'0');
  $('gexBtn').classList.toggle('on', GEXBARS);
  if(S.length) draw(cur);
});

// Reveal/playback toggle (time views) — hide everything ahead of the playhead; client-side redraw
$('revealBtn').addEventListener('click', ()=>{
  REVEAL = !REVEAL; localStorage.setItem('gex_reveal', REVEAL?'1':'0');
  $('revealBtn').classList.toggle('on', REVEAL);
  if(S.length) draw(cur);
});

// underlying toggle
$('uSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...$('uSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  $('uStock').value = '';                    // picking an index clears the stock dropdown
  U=b.dataset.u; $('subttl').textContent = U+' · gamma exposure · live chain';
  stop(); EXP=''; load(false).then(autoLiveOrOff);
});
// stock dropdown → same underlying-change path as the index buttons
$('uStock').addEventListener('change', e=>{
  const v=e.target.value; if(!v) return;
  [...$('uSeg').children].forEach(x=>x.classList.remove('on'));   // deselect index buttons
  U=v; $('subttl').textContent = U+' · gamma exposure · live chain';
  stop(); EXP=''; load(false).then(autoLiveOrOff);
});
function onDateChange(){ const v=$('datePick').value; if(!v || v===DATE) return; DATE=v; stop(); EXP=''; load(false).then(autoLiveOrOff); }
$('datePick').addEventListener('change', onDateChange);   // calendar pick fires 'change' on commit
$('expSel').addEventListener('change', e=>{ EXP=e.target.value; stop(); load(true); });

// live auto-refresh (re-pull full day, keep scrub position, jump to newest if at end)
function setLive(on){
  const btn=$('liveBtn'); btn.classList.toggle('on', on);
  $('liveTxt').textContent = 'Live: '+(on?'on':'off');
  clearInterval(liveTimer); liveTimer=null;
  if(on){ liveTimer=setInterval(async ()=>{
    const atEnd = cur>=S.length-1;
    await load(true); if(atEnd) show(S.length-1); updLastUpd();
  }, 20000); }
}
$('liveBtn').addEventListener('click', ()=> setLive(!$('liveBtn').classList.contains('on')));
// keep TODAY's chart auto-live during market hours (09:15–15:30 IST, Mon–Fri)
// IST wall-clock exposed via getUTC*/toISOString (browser-TZ independent). Date.now()
// is an absolute UTC epoch, so +5:30 alone = IST; adding getTimezoneOffset() was a bug
// that cancelled the shift on an IST browser → marketOpen() read UTC hours → returned
// false during real market hours → live auto-turned-OFF on every load (had to re-enable).
function _istNow(){ return new Date(Date.now()+330*60000); }
function marketOpen(){ const n=_istNow(), d=n.getUTCDay(); if(d===0||d===6) return false; const hm=n.getUTCHours()*60+n.getUTCMinutes(); return hm>=9*60+15 && hm<=15*60+30; }
function isToday(){ return DATE === _istNow().toISOString().slice(0,10); }
function autoLiveOrOff(){ setLive(isToday() && marketOpen()); }
// "chart last updated" — freshness of the newest snapshot (red if >3 min stale)
function updLastUpd(){
  const el=$('lastUpd'); if(!el) return;
  if(!S.length){ el.textContent='—'; return; }
  const dt=S[S.length-1].dt, hhmm=dt.slice(11,16);
  if(dt.slice(0,10) === _istNow().toISOString().slice(0,10)){
    const mins=Math.max(0, Math.round((Date.now()-new Date(dt.replace(' ','T')+'+05:30').getTime())/60000));
    el.innerHTML='🕐 '+hhmm+' <small style="opacity:.7">('+(mins<1?'just now':mins+'m ago')+')</small>';
    el.style.color = mins>3 ? 'var(--red)' : 'var(--mut)';
  } else { el.innerHTML='🕐 last '+hhmm; el.style.color='var(--mut)'; }
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && timer) stop(); });

applyView();   // set labels/legend/note for the persisted view before first paint

// init: default to the most recent day that HAS data (weekend / pre-market → the
// last trading day) instead of blindly today, which is blank when nothing's collected yet.
(async function initDate(){
  let latest = null;
  try{ const r = await (await fetch(`/api/gex?list=1&underlying=${U}`)).json(); const ds = r.dates||[]; latest = ds.length ? ds[ds.length-1] : null; }catch(e){}
  const now = _istNow();
  DATE = latest || now.toISOString().slice(0,10);
  $('datePick').value = DATE;
  await load(false);
  autoLiveOrOff();   // market hours pe today ka chart apne-aap live
})();
</script>
