<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto (Delta) — BTC</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--bd2:#21262d;--tx:#e6edf3;
        --mut:#8b949e;--grn:#3fb950;--red:#f85149;--blu:#1f6feb;--yel:#d29922;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:14px;}
  h1{font-size:18px;margin:0 0 2px;}
  .sub{color:var(--mut);font-size:12px;margin-bottom:12px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;}
  .kpi{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;}
  .kpi .b{font-size:22px;font-weight:700;}
  .kpi .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  .kpi .u{font-size:12px;color:var(--mut);}
  select,button{background:var(--bd2);color:var(--tx);border:1px solid var(--bd);
       border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;}
  button:hover,select:hover{background:var(--bd);}
  .seg button{border-radius:0;margin:0;}
  .seg button:first-child{border-radius:6px 0 0 6px;}
  .seg button:last-child{border-radius:0 6px 6px 0;border-left:0;}
  .seg button.on{background:var(--blu);border-color:var(--blu);color:#fff;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--bd2);white-space:nowrap;}
  th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;position:sticky;top:0;background:var(--card);}
  .strike{text-align:center;font-weight:700;background:var(--bd2);}
  tr.atm .strike{background:#1f6feb33;color:#79c0ff;}
  tr.atm td{background:#1f6feb0d;}
  .ce{color:#7ee2b8;} .pe{color:#f0a5a0;}
  .muted{color:var(--mut);} .grn{color:var(--grn);} .red{color:var(--red);}
  .flycard{border-left:3px solid var(--yel);}
  .legs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
  .leg{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;min-width:120px;}
  .leg .t{font-size:11px;color:var(--mut);}
  .leg.sell{border-color:#f8514955;} .leg.buy{border-color:#3fb95055;}
  .metrics{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;}
  .metrics div span{display:block;}
  .metrics .l{color:var(--mut);font-size:11px;}
  .note{color:var(--mut);font-size:11px;margin-top:8px;font-style:italic;}
  .tag{display:inline-block;background:var(--bd2);border:1px solid var(--bd);border-radius:5px;
       padding:1px 7px;font-size:11px;color:var(--mut);}
  .chainbox{max-height:70vh;overflow:auto;}
  @media(max-width:760px){.wrap{padding:8px}.kpi .b{font-size:18px}}
</style></head><body>
<div class="wrap">
  <h1>🪙 Crypto — BTC (Delta Exchange India)</h1>
  <div class="sub">Live spot + option chain + validated daily Iron-Fly setup ·
    <span class="tag">24/7 market</span> <span class="tag">expiry 12:00 UTC / 17:30 IST</span>
    <span class="tag">display-only</span></div>

  <div class="row">
    <span class="seg" id="uSeg">
      <button data-u="BTC" class="on">BTC</button>
      <button data-u="ETH">ETH</button>
    </span>
    <label class="muted">Expiry
      <select id="expSel"></select>
    </label>
    <button id="refreshBtn">↻ Refresh</button>
    <span class="muted" id="updated"></span>
  </div>

  <div class="card" style="margin-bottom:12px">
    <div class="kpi">
      <div><div class="l">BTC Spot</div><div class="b" id="kSpot">—</div></div>
      <div><div class="l">ATM</div><div class="b" id="kAtm">—</div></div>
      <div><div class="l">Expiry</div><div class="b" id="kExp">—</div></div>
      <div><div class="l">DTE</div><div class="b" id="kDte">—</div></div>
    </div>
  </div>

  <div class="card flycard" id="flyCard" style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>🦋 Daily Iron-Fly setup (validated)</b>
      <span class="tag" id="flyWing"></span>
    </div>
    <div class="legs" id="flyLegs"></div>
    <div class="metrics" id="flyMetrics"></div>
    <div class="note" id="flyNote"></div>
  </div>

  <div class="card" id="paperCard" style="margin-bottom:12px;border-left:3px solid var(--blu)">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <b>📝 Paper Iron-Fly <span class="tag" id="paperStatus">…</span></b>
      <span class="muted" id="paperTotal"></span>
    </div>
    <div id="paperOpen" style="margin-top:8px"></div>
    <div id="paperDone" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <b>Option chain</b>
    <div class="chainbox" style="margin-top:8px">
      <table id="chainTbl"><thead><tr>
        <th>Δ</th><th>OI</th><th>IV</th><th>CE ₹</th>
        <th class="strike">Strike</th>
        <th>PE ₹</th><th>IV</th><th>OI</th><th>Δ</th>
      </tr></thead><tbody id="chainBody"></tbody></table>
    </div>
  </div>
</div>

<script defer src="/static/js/topnav.js"></script>
<script>
let U = "BTC", EXP = null;
const $ = id => document.getElementById(id);
const f2 = v => (v==null || isNaN(v)) ? "—" : Number(v).toLocaleString('en-IN',{maximumFractionDigits:1});
const iv = v => (v==null||isNaN(v)) ? "—" : (v*100).toFixed(1)+"%";
const oi = v => (v==null||isNaN(v)) ? "—" : Number(v).toLocaleString('en-IN',{maximumFractionDigits:0});

async function loadChain(){
  const q = new URLSearchParams({underlying:U, n:9});
  if(EXP) q.set('expiry', EXP);
  let d;
  try{ d = await (await fetch('/api/delta-chain?'+q)).json(); }catch(e){ return; }
  if(!d || d.error){ $('chainBody').innerHTML='<tr><td colspan=9 class=muted>no data</td></tr>'; return; }

  // expiry dropdown (build once per underlying)
  const sel = $('expSel');
  if(sel.dataset.u !== U){
    sel.innerHTML = (d.expiries||[]).map(e =>
      `<option value="${e.code}">${e.label} · ${e.kind} · ${e.dte}d</option>`).join('');
    sel.dataset.u = U;
    if(EXP) sel.value = EXP;
  }
  $('kSpot').textContent = f2(d.spot);
  $('kAtm').textContent = f2(d.atm);
  $('kExp').textContent = d.expiry_label || "—";
  $('kDte').textContent = (d.dte==null?"—":d.dte+"d");
  $('updated').textContent = "updated " + new Date().toLocaleTimeString();

  $('chainBody').innerHTML = (d.rows||[]).map(r=>{
    const c=r.ce||{}, p=r.pe||{};
    return `<tr class="${r.atm?'atm':''}">
      <td class="muted">${c.delta==null?'':Number(c.delta).toFixed(2)}</td>
      <td class="muted">${oi(c.oi)}</td>
      <td class="muted">${iv(c.iv)}</td>
      <td class="ce">${f2(c.ltp)}</td>
      <td class="strike">${f2(r.strike)}</td>
      <td class="pe">${f2(p.ltp)}</td>
      <td class="muted">${iv(p.iv)}</td>
      <td class="muted">${oi(p.oi)}</td>
      <td class="muted">${p.delta==null?'':Number(p.delta).toFixed(2)}</td>
    </tr>`;
  }).join('') || '<tr><td colspan=9 class=muted>no strikes</td></tr>';
}

async function loadFly(){
  const q = new URLSearchParams({underlying:U});
  if(EXP) q.set('expiry', EXP);
  let d;
  try{ d = await (await fetch('/api/delta-ironfly?'+q)).json(); }catch(e){ return; }
  if(!d || d.error){ $('flyLegs').innerHTML='<span class=muted>no data</span>'; return; }
  $('flyWing').textContent = `ATM ${f2(d.atm)} · wings ±${d.wing}`;
  $('flyLegs').innerHTML = (d.legs||[]).map(l=>{
    const cls = l.side==='SELL'?'sell':'buy';
    return `<div class="leg ${cls}">
      <div class="t">${l.side} ${l.cp==='C'?'CE':'PE'} ${f2(l.strike)}</div>
      <div><b>${f2(l.premium)}</b> <span class="muted">iv ${iv(l.iv)}</span></div>
    </div>`;
  }).join('');
  const m = [
    ['Net credit', f2(d.net_credit_pts)+' pts', 'grn'],
    ['Max profit', f2(d.max_profit_pts)+' pts', 'grn'],
    ['Max loss', f2(d.max_loss_pts)+' pts', 'red'],
    ['Breakeven ▲', f2(d.breakeven_up), ''],
    ['Breakeven ▼', f2(d.breakeven_dn), ''],
  ];
  $('flyMetrics').innerHTML = m.map(x=>
    `<div><span class="l">${x[0]}</span><span class="${x[2]}"><b>${x[1]}</b></span></div>`).join('');
  $('flyNote').textContent = d.note || '';
}

async function loadPaper(){
  let d;
  try{ d = await (await fetch('/api/delta-paper')).json(); }catch(e){ return; }
  if(!d){ return; }
  const cfg = d.config||{};
  const on = cfg.enabled;
  const exec = (cfg.execution||'sim')==='testnet' ? 'testnet' : 'paper';
  $('paperStatus').textContent = on ? ('ARMED ('+exec+')') : 'OFF';
  $('paperStatus').style.color = on ? 'var(--grn)' : 'var(--mut)';
  const tp = d.total_pnl_pts||0, tu = d.total_pnl_usd||0;
  $('paperTotal').innerHTML = `${d.n||0} settled · total <b class="${tp>=0?'grn':'red'}">${f2(tp)} pts</b> (~$${f2(tu)})`;

  const op = d.open;
  if(op){
    const m = d.open_mtm || null;
    const mleg = {};
    if(m && m.legs){ m.legs.forEach(x=>{ mleg[x.symbol] = x; }); }
    const legs = (op.legs||[]).map(l=>{
      const en = (l.entry_fill!=null?l.entry_fill:l.entry_premium);
      const lm = mleg[l.symbol];
      const now = (lm && lm.ltp!=null) ? ` → <b>${f2(lm.ltp)}</b>` : '';
      const lp = (lm && lm.pnl_pts!=null) ? ` <span class="${lm.pnl_pts>=0?'grn':'red'}">(${lm.pnl_pts>=0?'+':''}${f2(lm.pnl_pts)})</span>` : '';
      return `${l.side==='SELL'?'S':'B'} ${l.strike}${l.cp} @${f2(en)}${now}${lp}`;
    }).join(' · ');
    const rec = op.reconcile ? ` · reconcile: <b class="${op.reconcile==='match'?'grn':'red'}">${op.reconcile}</b>` : '';
    const md = op.mode==='testnet' ? ' <span class="tag">testnet</span>' : '';
    let mtmBadge = '';
    if(m && m.pnl_pts!=null){
      const p = m.pnl_pts, cls = p>=0?'grn':'red', sg = p>=0?'+':'';
      const pct = (m.pct_of_credit!=null) ? ` · ${sg}${f2(m.pct_of_credit)}% of credit` : '';
      const partial = (m.complete===false) ? ' <span class="muted" title="some legs missing live mark">(partial)</span>' : '';
      mtmBadge = `<div style="margin-top:2px">Live MTM <b class="${cls}">${sg}${f2(p)} pts</b> <span class="${cls}">(~$${sg}${f2(m.pnl_usd)})</span>${pct}${partial}</div>`;
    }
    $('paperOpen').innerHTML =
      `<div class="leg buy" style="min-width:auto"><div class="t">OPEN${md} · ATM ${op.atm} · exp ${op.expiry} · ${op.lots} lot · credit ${f2(op.net_credit_pts)} pts${rec}</div>
       ${mtmBadge}
       <div class="muted">${legs}</div></div>`;
  } else {
    $('paperOpen').innerHTML = `<span class="muted">No open paper position${on?' — will enter ~00:00 UTC (05:30 IST)':''}.</span>`;
  }
  const done = (d.completed||[]).slice().reverse();
  if(done.length){
    $('paperDone').innerHTML =
      '<table style="margin-top:4px"><thead><tr><th style="text-align:left">Exit</th><th>Exp</th><th>Settle spot</th><th>P&L pts</th><th>~$</th></tr></thead><tbody>'+
      done.map(c=>{
        const p=c.pnl_pts||0;
        return `<tr><td style="text-align:left" class="muted">${(c.exit_time||'').slice(0,16).replace('T',' ')}</td>
          <td>${c.expiry||''}</td><td>${f2(c.settle_spot)}</td>
          <td class="${p>=0?'grn':'red'}">${f2(p)}</td><td class="${p>=0?'grn':'red'}">${f2(c.pnl_usd)}</td></tr>`;
      }).join('')+'</tbody></table>';
  } else {
    $('paperDone').innerHTML = '';
  }
}

function reload(){ loadChain(); loadFly(); loadPaper(); }

$('uSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  U = b.dataset.u; EXP=null;
  [...$('uSeg').children].forEach(x=>x.classList.toggle('on', x===b));
  $('expSel').dataset.u=''; reload();
});
$('expSel').addEventListener('change', e=>{ EXP=e.target.value; reload(); });
$('refreshBtn').addEventListener('click', reload);
reload();
setInterval(()=>{ if(!document.hidden) reload(); }, 20000);
</script>
</body></html>
